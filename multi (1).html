<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>República — Multijogador Ácido</title>
    <style>
        :root {
            --bg: #121214;
            --surface: #1a1a1e;
            --border: #29292e;
            --text: #e1e1e6;
            --mut: #8d8d99;
            --prm: #00b37e;
            --prm-h: #00875f;
            --r: #f75a68;
            --y: #fba94c;
            --g: #00b37e;
            --b: #4e8fe7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #app { width: 100%; max-width: 900px; }
        .card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 8px; margin-bottom: 16px; }
        h2 { margin-bottom: 12px; font-size: 1.4rem; }
        p { margin-bottom: 10px; line-height: 1.4; }
        input[type="text"], select { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; margin-bottom: 12px; font-size: 1rem; }
        button { background: var(--border); color: var(--text); border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        button.primary { background: var(--prm); color: #fff; }
        button.primary:hover { background: var(--prm-h); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .op { display: block; background: var(--bg); border: 1px solid var(--border); padding: 12px; border-radius: 6px; margin-bottom: 8px; cursor: pointer; font-size: 0.95rem; }
        .op input { margin-right: 8px; }
        .row { margin: 12px 0; }
        .row label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 4px; }
        input[type="range"] { width: 100%; accent-color: var(--prm); margin-bottom: 8px; }
        .bar { background: var(--border); height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
        .bar i { display: block; height: 100%; transition: width 0.3s; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .tbl { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .tbl th, .tbl td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); }
        .tbl tr.morto td { color: var(--mut); text-decoration: line-through; }
        .cod { font-size: 2.5rem; font-weight: bold; text-align: center; color: var(--prm); letter-spacing: 4px; margin: 12px 0; }
        details { background: var(--bg); padding: 12px; border-radius: 6px; border: 1px solid var(--border); margin-top: 12px; cursor: pointer; }
        summary { font-weight: bold; }
        .voltar { display: inline-block; margin-bottom: 15px; color: var(--mut); text-decoration: none; font-size: 0.9rem; }
    </style>
    <!-- Dependência obrigatória para o PeerJS funcionar no navegador -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>
    <a href="index.html" class="voltar">← Voltar para o Modo Solo</a>
    <div id="app">Carregando interface...</div>
    <script src="multi.js"></script>
</body>
</html>
