<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>República — Simulador de Governo Online</title>
<style>
:root{--bg:#0e1a14;--card:#16271e;--tx:#e8f1ea;--mut:#8fa898;--g:#2ecc71;--y:#f1c40f;--r:#e74c3c;--b:#3498db}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;background:#0a120e;border-bottom:2px solid var(--g)}
h1{margin:0;font-size:1.3rem}h1 small{color:var(--mut);font-weight:400;font-size:.8rem}
h2{font-size:.95rem;margin:14px 0 8px;color:var(--y)}
#data{color:var(--mut)}
button{background:#22392c;color:var(--tx);border:1px solid #35553f;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.85rem}
button:hover:not(:disabled){background:#2d4b39}button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--g);color:#06210f;font-weight:700;border:0}
#kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:12px 18px}
.kpi{background:var(--card);border-radius:10px;padding:10px;text-align:center}
.kpi b{display:block;font-size:1.25rem}.kpi span{font-size:.72rem;color:var(--mut)}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;padding:0 18px 24px}
.card{background:var(--card);border-radius:12px;padding:6px 16px 16px}
.row{margin:8px 0;font-size:.85rem}.row label{display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--g)}
.bar{height:9px;background:#0b150f;border-radius:5px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%}
.acao{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0;font-size:.8rem}
#log{max-height:240px;overflow:auto;font-size:.8rem;color:var(--mut)}#log p{margin:4px 0;border-left:3px solid #35553f;padding-left:8px}
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal[hidden]{display:none}
.box{background:var(--card);border:2px solid var(--y);border-radius:14px;padding:20px;max-width:520px;width:100%}
.box h3{margin-top:0;color:var(--y)}.box button{display:block;width:100%;margin:8px 0;text-align:left;padding:12px}
#news{margin:10px 18px 0;padding:10px 14px;background:#2a2410;border-left:4px solid var(--y);border-radius:8px;font-size:.88rem;font-style:italic}
#md{max-height:50vh;overflow:auto;font-size:.88rem;line-height:1.5}
#tela{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20;overflow:auto}
#tela[hidden]{display:none}
#tela .box{max-width:460px;width:100%}#tela .box.wide{max-width:760px}
.mapa{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(5,64px);gap:6px;margin:10px 0}
.pais{padding:2px;font-size:1.3rem;text-align:center;line-height:1.1}
.pais small{display:block;font-size:.6rem;color:var(--mut)}.pais em{display:block;font-size:.58rem;color:var(--y);font-style:normal}
.pais.oc{background:#3a2a10}.pais.sel{border-color:var(--g);background:#1f4a2f}
.rk{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #22392c;font-size:.85rem}
.rk button{padding:3px 8px}.morto{opacity:.4}
.mut{color:var(--mut);font-size:.85rem}.err{color:var(--r);font-size:.85rem}
input[type=text]{width:100%;padding:11px;border-radius:8px;border:1px solid #35553f;background:#0b150f;color:var(--tx);margin:6px 0;font-size:.95rem}
@media(max-width:600px){.mapa{grid-template-rows:repeat(5,58px)}.pais small{font-size:.5rem}}

body{padding-bottom:70px}h1 small{display:none}
header{padding:10px 14px}.btns{display:flex;gap:6px;flex-wrap:wrap}.btns button{padding:7px 10px;font-size:.8rem}
#news{font-size:.78rem;padding:7px 10px;margin:8px 14px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#kpis{grid-template-columns:repeat(3,1fr);padding:8px 14px;gap:6px}.kpi{padding:6px}.kpi b{font-size:1.05rem}
main{display:block;max-width:760px;margin:0 auto;padding:0 14px 20px}main>.card{display:none;margin-bottom:12px}
body[data-aba=mundo] #c-mundo,body[data-aba=orc] #c-orc,body[data-aba=nacao] #c-nacao,body[data-aba=acao] #c-acao,body[data-aba=rank] #c-rank{display:block}
#modal{z-index:15}
#abas{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a120e;border-top:2px solid var(--g);z-index:10}
#abas button{flex:1;border:0;border-radius:0;background:none;padding:8px 2px;font-size:.68rem;color:var(--mut)}#abas button span{display:block;font-size:1.25rem}#abas button.on{color:var(--g);background:#16271e}
.acs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.acs button{padding:10px 4px;text-align:center}
.alvo{display:flex;justify-content:space-between;align-items:center;margin:8px 0}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips button.on{border-color:var(--g);background:#1f4a2f}
#globo{position:fixed;inset:0;z-index:0;width:100%;height:100%;background:#000}
header{position:relative;z-index:1;background:#0a120ee6}#news,#kpis,main{position:relative;z-index:1}.card{background:#16271eef}
main,#kpis,#news{pointer-events:none}main>.card,.kpi,#news{pointer-events:auto}
body[data-aba=mundo] #c-mundo,body.pre #c-mundo{display:block;position:fixed;left:10px;right:10px;bottom:70px;z-index:5;max-height:42vh;overflow:auto;margin:0}
body.pre #c-mundo{bottom:12px}body:not([data-aba=mundo]) #globo{opacity:.3;pointer-events:none}
body.pre header,body.pre #news,body.pre #kpis,body.pre #abas{display:none}#tela{background:#0007}
#inds,#rels{display:flex;gap:6px;align-items:flex-end;height:215px;perspective:650px;padding:6px 4px 0}#rels{height:175px}
.c3{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:.62rem;color:var(--mut)}.c3 b{color:var(--tx);font-size:.8rem;margin-bottom:6px}.c3 span{margin-top:7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col{position:relative;width:24px;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(-32deg);animation:cresce .9s ease-out}.col i{position:absolute;display:block;background:var(--c)}
.col .f{left:0;top:0;width:24px;height:100%}.col .s{left:24px;top:0;width:14px;height:100%;transform-origin:left;transform:rotateY(90deg);filter:brightness(.62)}.col .t{left:0;top:0;width:24px;height:14px;transform-origin:top;transform:rotateX(90deg);filter:brightness(1.35)}
@keyframes cresce{from{height:0}}
#flash{position:fixed;inset:0;background:radial-gradient(circle,#fff,#ffb74d 40%,transparent 75%);pointer-events:none;opacity:0;z-index:30}#flash.on{animation:fl 1.4s ease-out}@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.treme #globo,.treme header{animation:tr .12s 7}@keyframes tr{0%,100%{transform:translate(0)}25%{transform:translate(-7px,3px)}50%{transform:translate(6px,-4px)}75%{transform:translate(-3px,-4px)}}
.g3d{display:flex;gap:5px;align-items:flex-end;height:185px;perspective:650px;margin:8px 0;padding-top:4px}.g3d.s{height:125px}.g3d .col{width:20px}.g3d .col .f,.g3d .col .t{width:20px}.g3d .col .s{left:20px}
#acoes{display:grid;grid-template-columns:1fr 1fr;gap:12px;perspective:700px;padding:6px 2px}
#acoes .acao{flex-direction:column;align-items:stretch;background:#22392c;border-radius:10px;padding:10px;margin:0;transform:rotateX(10deg);box-shadow:0 7px 0 #0b150f,0 14px 18px #0009;transition:.15s;text-align:center}
#acoes .acao:hover{transform:rotateX(0) translateY(-3px)}#acoes .acao button{box-shadow:0 4px 0 #0b150f;transition:.1s}#acoes .acao button:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.acs button,.chips button,.btns button{box-shadow:0 4px 0 #0b150f;transition:.1s}.acs button:active:not(:disabled),.chips button:active,.btns button:active{transform:translateY(4px);box-shadow:none}
</style>
</head>
<body>
<header>
  <h1>República <small>Simulador de Governo (sem vergonha)</small></h1>
  <div id="data"></div>
  <div class="btns">
    <button id="prox" class="primary">Enrolar mais 1 mês ▶</button>
    <button id="ano">Enrolar 3 meses ⏩</button>
    <button id="mapa">🗺️ Mapa</button>
    <button id="man">📖 Manual</button>
    <button id="novo">Renunciar e recomeçar</button>
  </div>
</header>
<div id="news"></div>
<section id="kpis"></section>
<main>
  <div class="card"><h2>🏆 Ranking ao vivo</h2><div id="rank"></div></div>
  <div class="card"><h2>💰 Orçamento (% do PIB)</h2><div id="ctrl"></div></div>
  <div class="card"><h2>📊 Nação</h2><div id="inds"></div><h2>🌍 Relações</h2><div id="rels"></div></div>
  <div class="card"><h2>🏛️ Ações de governo</h2><div id="acoes"></div><h2>📰 Diário</h2><div id="log"></div></div>
</main>
<div id="modal" hidden><div class="box"><h3 id="mt"></h3><p id="md"></p><div id="mo"></div></div></div>
<div id="tela"></div>

  gasto:{...base},ind:{saude:55,educ:50,seg:45,mil:40,infra:45,amb:50},

let S=null;
const save=()=>{if(typeof Rede!=="undefined")Rede.publicar()};

function ap(o){for(const k in o){if(k==="fim"){S.fim=o[k];continue}if(k==="dado"){const r=Math.random()<.5;msg(r?"🎲 Deu sorte (por enquanto).":"🎲 Deu muito errado, como esperado.");ap(o[k][r?0:1]);continue}const [a,b]=k.split(".");
  if(b)S[a][b]=cl(S[a][b]+o[k]);
  else if(["aprov","cong"].includes(a))S[a]=cl(S[a]+o[k]);
  else S[a]+=o[k];}}

function msg(t){S.log.unshift(`${dataStr()}: ${t}`);S.log=S.log.slice(0,40)}
const dataStr=()=>`${MESES[S.mes%12]}/${2027+Math.floor(S.mes/12)}`;

function tick(){
  if(!S||S.fim||S.ev!==null)return;
  const gs=Object.values(S.gasto).reduce((a,b)=>a+b,0);
  const juros=S.divida*S.selic/100, def=10+gs+juros-S.imp;
  S.divida+=def/12-S.divida*S.g/1200;
  for(const k in S.ind)S.ind[k]=cl(S.ind[k]+(S.gasto[k]-base[k])/base[k]*1.5-.25+(Math.random()-.5)*.4);
  for(const k in S.rel)S.rel[k]=cl(S.rel[k]+(S.ind.mil-50)/500+(50-S.rel[k])*.01);
  const rg=Object.values(S.rel).reduce((a,b)=>a+b,0)/4-55;
  const gt=2+(S.ind.infra-50)/25+(S.ind.educ-50)/60+rg/30-(S.imp-32)*.15-(S.selic-10.5)*.18-(S.infl-4.5)*.12+(S.cong-50)/80;
  S.g+=(gt-S.g)*.25+(Math.random()-.5)*.2;
  S.infl=Math.max(0,S.infl+def*.02-(S.selic-10.5)*.03-(S.infl-4.5)*.04+(Math.random()-.5)*.15);
  S.desemp=Math.max(2,S.desemp-(S.g-2)*.08+(S.selic-10.5)*.02);
  const t=(S.g-2)*1.2-(S.infl-4.5)*1.2-(S.desemp-7.5)*1.2+(S.ind.saude-50)/25+(S.ind.seg-50)/30+(S.ind.educ-50)/60-(S.imp-32)*.3;
  S.aprov=cl(S.aprov+t*.4-.2);
  S.cong=cl(S.cong+(S.aprov-S.cong)*.05);
  for(const k in S.cd)if(--S.cd[k]<=0)delete S.cd[k];
  S.mes++;
  if(S.aprov<12){S.fim="💥 Impeachment! Foi o único assunto em que o Congresso inteiro concordou.";}
  else if(S.divida>100&&Math.random()<.04){S.fim="🚔 Você foi preso por não pagar as dívidas do país! O policial disse: “o senhor tem direito de ficar calado, mas o Serasa não”.";}
  else if(S.divida>130){S.fim="💥 Calote! A dívida explodiu e o FMI mudou de número.";}
  else if(S.infl>20){S.fim="💥 Hiperinflação! Cafezinho custa um rim, o salário vira meme e o brasileiro agora paga em pão de queijo.";}
  else if(S.mes===48){
    if(S.aprov+(Math.random()-.5)*16>=45){msg("Reeleito! O povo esqueceu tudo em tempo recorde.");}
    else S.fim="🗳️ Você perdeu a reeleição. Ainda dá tempo de virar coach de palestra motivacional.";
  }else if(S.mes>=96)S.fim="🏁 Fim do mandato. Você sai com aposentadoria vitalícia e o país com a conta.";
  if(!S.fim&&Math.random()<.35)S.ev=Math.floor(Math.random()*EVENTOS.length);
  S.news=manchete();save();draw();
}
function manchete(){const h=["Estudo mostra que 100% dos políticos prometem e 0% lembram.","Brasileiro descobre que o Pix também funciona pra pagar dívida (sem sucesso).","Tio do zap compartilha 14 áudios dizendo que o governo é culpado por tudo."];

  if(S.cong<30)h.push("Congresso te ignora tanto que já te trata como parente.");
  return h[Math.floor(Math.random()*h.length)]}

<script>
"use strict";
// Rede: um único mundo global via MQTT sobre WebSocket (brokers públicos, sem cadastro e sem servidor próprio).
// Cada jogador publica o próprio estado numa mensagem "retida"; quem sai tem a mensagem apagada pelo broker (testamento).
// País: quem tiver o carimbo de tempo mais antigo leva. Eventos mundiais: o jogador de menor id sorteia.
const Rede=(()=>{
  const P="repbr/v2/";
  const BROKERS=["wss://broker.hivemq.com:8884/mqtt","wss://broker.emqx.io:8084/mqtt","wss://test.mosquitto.org:8081"];
  const id=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
  let cl=null,tent=0,conectado=false,off=false,lista={},cb={},meu=null,confirmado=false,tp=null,sorteioOn=false,tempo=null,pendente=null;
  const avisa=()=>cb.lista&&cb.lista(lista);
  const falha=m=>cb.erro&&cb.erro(m);
  const pub=(t,o,retain)=>{if(!cl||!conectado)return;try{cl.publish(P+t,o==null?"":JSON.stringify(o),{qos:0,retain:!!retain})}catch(e){}};
  const limpaMeu=()=>{meu=null;confirmado=false;pub("p/"+id,null,true);delete lista[id];avisa()};

  function dono(pais){ // vencedor do país: carimbo mais antigo, desempate por id
    let w=null;
    for(const k in lista){const j=lista[k];if(j.pais!==pais)continue;
      if(!w||j.t<lista[w].t||(j.t===lista[w].t&&k<w))w=k}
    return w;
  }
  function onMsg(topic,buf){
    let m=null;const s=buf?buf.toString():"";
    if(topic.indexOf(P+"p/")===0){
      const k=topic.slice((P+"p/").length);
      if(!s){delete lista[k]}
      else{try{m=JSON.parse(s)}catch(e){return}
        if(k===id&&!meu)return; // eco de algo que já descartei
        m.rt=Date.now();lista[k]=m}
      avisa();
    }else if(topic===P+"atq/"+id){try{m=JSON.parse(s)}catch(e){return}m.k?(cb.acao&&cb.acao(m)):(cb.atq&&cb.atq(m.de,m.i))}
    else if(topic===P+"mundo"){try{m=JSON.parse(s)}catch(e){return}
      if(m.k){cb.acao&&cb.acao(m);return}
      if(!m.para||m.para===id)cb.mundo&&cb.mundo(m.i)}
  }
  function sorteio(){
    if(!conectado&&!off)return;
    const ids=Object.keys(lista).filter(k=>lista[k].pais).sort();
    if(!ids.length||ids[0]!==id)return;
    const i=Math.floor(Math.random()*MUNDOEV.length);
    const para=MUNDOEV[i].solo?ids[Math.floor(Math.random()*ids.length)]:null;
    if(off)(!para||para===id)&&cb.mundo&&cb.mundo(i);else pub("mundo",{i,para},false);
  }
  function envioEstado(){if(meu&&confirmado)pub("p/"+id,meu,true)}
  function timers(){
    if(sorteioOn)return;sorteioOn=true;
    setInterval(sorteio,40000);
    setInterval(envioEstado,20000);
    setInterval(()=>{const a=Date.now();let mudou=false;for(const k in lista)if(k!==id&&a-lista[k].rt>75000){delete lista[k];mudou=true}if(mudou)avisa()},10000);
    if(typeof window!=="undefined"&&window.addEventListener)window.addEventListener("pagehide",()=>{try{pub("p/"+id,null,true)}catch(e){}});
  }

  function fecha(){try{cl&&(cl.removeAllListeners&&cl.removeAllListeners(),cl.on&&cl.on("error",()=>{}),cl.end(true))}catch(e){}cl=null;conectado=false}
  function tenta(i){
    if(off)return;
    if(typeof mqtt==="undefined"){falha("Carregando a rede do jogo...");setTimeout(()=>tenta(i),1000);return}
    const n=++tent;fecha();
    let c;
    try{c=mqtt.connect(BROKERS[i],{clientId:"rb"+id,clean:true,connectTimeout:9000,reconnectPeriod:0,keepalive:30,
      will:{topic:P+"p/"+id,payload:"",qos:0,retain:true}})}
    catch(e){return proximo(i,n)}
    cl=c;
    let ok=false;
    const limite=setTimeout(()=>{if(n===tent&&!ok){proximo(i,n)}},11000);
    c.on("connect",()=>{
      if(n!==tent)return;
      c.subscribe([P+"p/+",P+"atq/"+id,P+"mundo"],{qos:0},err=>{
        if(n!==tent)return;
        if(err){clearTimeout(limite);return proximo(i,n)}
        ok=true;clearTimeout(limite);conectado=true;timers();
        // espera as mensagens retidas (jogadores já no mundo) chegarem antes de mostrar o mapa
        setTimeout(()=>{if(n!==tent||!conectado)return;cb.pronto&&cb.pronto()},1500);
      });
    });
    c.on("message",(t,b)=>{if(n===tent)onMsg(t,b)});
    c.on("error",()=>{if(n!==tent)return;if(!ok){clearTimeout(limite);proximo(i,n)}});
    c.on("close",()=>{
      if(n!==tent)return;
      if(!ok){clearTimeout(limite);return proximo(i,n)}
      conectado=false;confirmado=false;lista={};avisa();
      falha("A conexão caiu. Reconectando ao mundo...");
      setTimeout(()=>tenta(0),1500+Math.random()*1500);
    });
  }
  function proximo(i,n){
    if(n!==tent||off)return;
    tent++;fecha();
    if(i+1<BROKERS.length){falha("Conectando ao mundo... (servidor "+(i+2)+" de "+BROKERS.length+")");setTimeout(()=>tenta(i+1),300)}
    else{falha("Sem resposta dos servidores. Tentando de novo...");setTimeout(()=>tenta(0),3000)}
  }

  return{
    on:o=>{Object.assign(cb,o)},lista:()=>lista,eu:()=>id,
    conectar(){off=false;if(cl||conectado)return;tenta(0)},
    offline(){off=true;tent++;fecha();lista={};timers();cb.pronto&&cb.pronto()},
    escolherPais(pais,nome){
      for(const k in lista)if(k!==id&&lista[k].pais===pais)return falha("Esse país já tem dono. Escolha outro!");
      if(!off&&!conectado)return falha("Sem conexão com o mundo ainda. Aguarde um instante.");
      const antigo=meu&&meu.pais===pais?meu:null;
      meu=antigo||{nome:String(nome||"Presidente").slice(0,16),pais,leg:0,aprov:0,mes:0,fim:0,t:Date.now()};
      meu.rt=Date.now();lista[id]=meu;confirmado=false;
      if(off){confirmado=true;avisa();return cb.ok&&cb.ok(pais)}
      pub("p/"+id,meu,true);avisa();
      clearTimeout(pendente);
      pendente=setTimeout(()=>{ // janela de 1s para ver se alguém mais antigo pediu o mesmo país
        if(!meu||meu.pais!==pais)return;
        if(dono(pais)===id){confirmado=true;cb.ok&&cb.ok(pais)}
        else{limpaMeu();falha("Esse país já tem dono. Escolha outro!")}
      },1000);
    },
    publicar(){
      clearTimeout(tp);
      tp=setTimeout(()=>{
        const d=cb.snap&&cb.snap();if(!d||!meu||!confirmado)return;
        Object.assign(meu,d);
        if(off){avisa();return}
        pub("p/"+id,meu,true);
      },300);
    },
    enviar(para,m){if(!off)pub("atq/"+para,m,false)},
    difundir(m){if(off)cb.acao&&cb.acao(m);else pub("mundo",m,false)},
    atacar(para,i){
      const j=lista[para];if(!j)return;
      if(off)return;
      pub("atq/"+para,{de:(meu&&meu.nome)||"Alguém",i},false);
    }
  };
})();

</script>
<script>

const kpi=(n,v,ruim)=>`<div class="kpi"><b style="color:${ruim?"var(--r)":"var(--tx)"}">${v}</b><span>${n}</span></div>`;

function draw(){
  $("#data").textContent=`${quem()} · ${dataStr()} · Mandato ${S.mes<48?1:2} · mês ${S.mes}/96`;

  <div class="row"><label><span>Selic (Banco Central)</span><b>${S.selic.toFixed(2)}%</b></label><input type="range" min="2" max="20" step=".25" value="${S.selic}" data-k="selic"></div>`;
  for(const k in base)c+=`<div class="row"><label><span>${nomes[k]}</span><b>${S.gasto[k].toFixed(1)}%</b></label><input type="range" min="0" max="${base[k]*2.5}" step=".1" value="${S.gasto[k]}" data-g="${k}"></div>`;
  c+=`<p style="font-size:.8rem;color:${def>0?"var(--r)":"var(--g)"}">Resultado anual: ${def>0?"déficit (a conta fica pros seus netos)":"superávit (alguém roubou menos que o normal)"}: ${Math.abs(def).toFixed(1)}% do PIB</p>`;
  $("#ctrl").innerHTML=graf3d()+c;
  $("#inds").innerHTML=Object.keys(S.ind).map(k=>bar(nomes[k],S.ind[k])).join("");
  $("#rels").innerHTML=Object.keys(S.rel).map(k=>bar(k,S.rel[k])).join("");
  $("#acoes").innerHTML=ACOES.map((a,i)=>`<div class="acao"><span>${a[0]}</span><button data-a="${i}" ${S.cd[i]||S.fim?"disabled":""}>${S.cd[i]?S.cd[i]+"m":"Aprontar"}</button></div>`).join("");
  $("#log").innerHTML=S.log.map(l=>`<p>${l}</p>`).join("");

    $("#mo").innerHTML=e.o.map((o,i)=>`<button data-e="${i}">${o[0]}</button>`).join("")+`<button data-e="coin">🎲 Cara ou coroa (deixa o azar decidir)</button>`;m.hidden=false;}
  else m.hidden=true;
}
function reset(){iniciarJogo()}

document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.g)S.gasto[t.dataset.g]=+t.value;else if(t.dataset.k)S[t.dataset.k]=+t.value;else return;
  save();const p=t.previousElementSibling;if(p)p.querySelector("b").textContent=(+t.value).toFixed(1);});
document.addEventListener("change",e=>{if(e.target.type==="range")draw()});
document.addEventListener("click",e=>{const t=e.target;
  if(t.dataset.a!==undefined){const a=ACOES[t.dataset.a];ap(a[1]);S.cd[t.dataset.a]=6;msg(a[0]+".");save();draw();}
  if(t.dataset.e!==undefined){const ix=t.dataset.e==="coin"?Math.floor(Math.random()*2):t.dataset.e;const o=EVENTOS[S.ev].o[ix];ap(o[1]);msg(`${EVENTOS[S.ev].t}: ${o[0]}.`);S.ev=null;save();draw();}
});
$("#prox").onclick=()=>tick();
$("#ano").onclick=()=>{for(let i=0;i<3&&!S.fim&&S.ev===null;i++)tick()};
const MANUAL=`<b>Objetivo:</b> sobreviver 8 anos sem ser preso, derrubado ou cancelado.<br><br>
<b>Topo da tela:</b><br>• <b>Aprovação</b>: abaixo de 12% = impeachment. No mês 48 ela decide a reeleição.<br>• <b>Congresso</b>: apoio dos deputados. Baixo = tudo piora.<br>• <b>Crescimento</b>: o PIB. Quanto mais, melhor.<br>• <b>Inflação</b>: acima de 20% o país acaba.<br>• <b>Desemprego</b>: alto derruba sua aprovação.<br>• <b>Dívida/PIB</b>: acima de 100% pode te levar pra cadeia, acima de 130% é calote.<br><br>
<b>Orçamento (barras deslizantes):</b><br>• <b>Carga tributária</b>: mais imposto = mais dinheiro, mas o povo te odeia e a economia freia.<br>• <b>Selic</b>: alta segura a inflação mas trava o crescimento. Baixa faz o contrário.<br>• <b>Gastos</b>: gastar mais melhora o setor, mas aumenta a dívida.<br>• Embaixo aparece déficit (vermelho: dívida sobe) ou superávit (verde: dívida cai).<br><br>
<b>Nação:</b> barra verde é boa, vermelha é desastre. Saúde, educação, segurança e infraestrutura mexem com crescimento e aprovação. Defesa ajuda nas relações. Meio ambiente agrada a Europa.<br><br>
<b>Relações:</b> EUA, China, UE e Argentina. Relação boa ajuda o PIB. Agradar um às vezes irrita outro.<br><br>
<b>Ações de governo:</b> cada uma só pode ser usada 1 vez a cada 6 meses. Leia o nome com atenção, a maioria tem pegadinha.<br><br>
<b>Eventos:</b> aparecem sozinhos e você escolhe. Com preguiça, use o 🎲 cara ou coroa.<br><br>
<b>Online:</b> cada jogador tem seu país. No ranking, clique no 💣 de um rival pra atacar (recarga de 20s). O host sorteia eventos mundiais que atingem todo mundo. O botão 🗺️ Mapa mostra quem é dono de quê.<br><br><b>Dica pros burros:</b> não deixe a dívida estourar, mantenha a aprovação acima de 40 e não aperte botão vermelho nenhum.`;
function abrirManual(){$("#mt").textContent="📖 Manual do Presidente (pra quem não sabe ler)";$("#md").innerHTML=MANUAL;$("#mo").innerHTML='<button id="fechar">Entendi, vamos errar</button>';$("#modal").hidden=false}
$("#man").onclick=abrirManual;
document.addEventListener("click",e=>{if(e.target.id==="fechar")draw()});

<script>
"use strict";
// Início do jogo: telas de entrada e mapa, ranking, ataques e ligação com a rede
const EU={nome:"",pais:null};
let escolhido=null,mapaAberto=null,proxAtq=0,alvoAtq=null,msgErro="";
const quem=()=>EU.pais?`${EU.pais.f} ${EU.nome}`:"";
const tela=h=>{const t=$("#tela");t.innerHTML=h;t.hidden=!h};
const nm=()=>(($("#nome")&&$("#nome").value.trim())||"Presidente").slice(0,16);

function iniciarJogo(){
  S=novo();const m=EU.pais.mod;
  for(const k in m)S[k]+=m[k];
  S.aprov=cl(S.aprov);S.desemp=Math.max(2,S.desemp);S.infl=Math.max(0,S.infl);S.divida=Math.max(5,S.divida);
  S.log=[`${EU.nome} tomou posse em ${EU.pais.n}. ${EU.pais.tag}`];
  save();draw();
}

// ---- telas ----
function telaEntrada(){
  tela(`<div class="box"><h2>República</h2><p class="mut">Simulador de governo online. É um mundo só: você entra, escolhe um país e joga. Quem chegar primeiro leva o país.</p>
  <input type="text" id="nome" maxlength="16" placeholder="Nome do presidente" value="${esc(EU.nome)}">
  <button class="primary" data-t="entrar" style="width:100%">Entrar no mundo</button></div>`);
}
function telaConectando(){
  tela(`<div class="box"><h2>🌍 Conectando ao mundo...</h2><p class="mut">Procurando os outros presidentes. Pode levar alguns segundos.</p><p class="err">${esc(msgErro)}</p>
  <p class="mut">Continuando a tentar entrar no mundo online...</p>
  <button data-t="offline" style="width:100%;margin-top:8px">Jogar offline (só você, sem ranking)</button>
  <button data-t="voltar" style="width:100%;margin-top:8px">Voltar</button></div>`);
}
function abrirMapa(escolher){
  const L=Rede.lista(),dono=id=>Object.values(L).find(j=>j.pais===id),p=escolhido&&PAISES.find(x=>x.id===escolhido);
  tela(`<div class="box wide"><h2>${escolher?"🗺️ Escolha seu país":"🗺️ Mapa do mundo"}</h2><div class="mapa">`+
    PAISES.map(c=>{const d=dono(c.id),meu=EU.pais&&EU.pais.id===c.id;
      return `<button class="pais ${d?"oc":""} ${meu||escolhido===c.id?"sel":""}" style="grid-column:${c.c};grid-row:${c.r}" ${escolher&&!d?`data-t="sel" data-id="${c.id}"`:"disabled"}>${c.f}<small>${c.n}</small>${d?`<em>${esc(d.nome)}</em>`:""}</button>`}).join("")+`</div>`+
    (escolher?(p?`<p><b>${p.f} ${p.n}:</b> ${p.tag}</p><button class="primary" data-t="ok" style="width:100%">Assumir o poder</button>`:`<p class="mut">${PAISES.every(c=>dono(c.id))?"Mundo lotado! Espere alguém sair.":"Clique num país livre. Quem chegar primeiro leva."}</p>`)+`<p class="err">${esc(msgErro)}</p>`
      :`<button data-t="fechar" style="width:100%">Fechar mapa</button>`)+`</div>`);
}

// ---- ranking e ataques ----
function desenhaRank(){
  const L=Rede.lista(),o=Object.entries(L).sort((a,b)=>(a[1].fim-b[1].fim)||b[1].leg-a[1].leg);
  $("#rank").innerHTML=`<p class="mut">🌍 Mundo ao vivo · ${o.length} jogando</p>`+o.map(([id,j],i)=>{
    const p=PAISES.find(x=>x.id===j.pais),meu=id===Rede.eu();
    return `<div class="rk ${j.fim?"morto":""}"><span>${["🥇","🥈","🥉"][i]||(i+1)+"º"} ${p?p.f:""} ${esc(j.nome)}${meu?" (você)":""}${j.fim?" 💀":""}</span><b>${j.leg} pts</b>${meu||j.fim?"":`<button data-t="atk" data-id="${id}">💣</button>`}</div>`}).join("");
}
function menuAtaque(id){
  const j=Rede.lista()[id];if(!j||!S||S.fim||S.ev!==null)return;
  alvoAtq=id;const w=Math.ceil((proxAtq-Date.now())/1000);
  $("#mt").textContent="💣 Atacar "+j.nome;
  $("#md").textContent=w>0?`Armas recarregando... ${w}s`:"Escolha o ataque (recarga de 20s).";
  $("#mo").innerHTML=ATQ.map((a,i)=>`<button data-t="atq" data-i="${i}" ${w>0?"disabled":""}>${a[0]}</button>`).join("")+`<button id="fechar">Cancelar</button>`;
  $("#modal").hidden=false;
}
function atacar(i){
  const a=ATQ[i],j=Rede.lista()[alvoAtq];if(!a||!j||Date.now()<proxAtq)return;
  Rede.atacar(alvoAtq,i);ap(a[2]);msg(`Você atacou ${j.nome}: ${a[0]}`);
  proxAtq=Date.now()+20000;save();draw();
}

// ---- cliques ----
document.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("[data-t]");if(!b)return;
  const t=b.dataset.t,id=b.dataset.id;
  if(t==="entrar"){EU.nome=nm();msgErro="";telaConectando();try{Rede.conectar()}catch(err){msgErro="Erro de conexão: "+err.message;telaConectando()}}
  else if(t==="offline"){msgErro="";Rede.offline()}
  else if(t==="voltar"){telaEntrada()}
  else if(t==="sel"){escolhido=id;msgErro="";abrirMapa(true)}
  else if(t==="ok"&&escolhido)Rede.escolherPais(escolhido,EU.nome);
  else if(t==="fechar"){mapaAberto=null;tela("")}
  else if(t==="atk")menuAtaque(id);
  else if(t==="atq")atacar(+b.dataset.i);
});
$("#mapa").onclick=()=>{mapaAberto="v";abrirMapa(false)};

// ---- ligação com a rede ----
Rede.on({
  pronto:()=>{if(EU.pais&&S)Rede.escolherPais(EU.pais.id,EU.nome);else{mapaAberto="e";abrirMapa(true)}},
  lista:()=>{desenhaRank();if(mapaAberto)abrirMapa(mapaAberto==="e")},
  ok:id=>{if(EU.pais&&S){save();return}EU.pais=PAISES.find(x=>x.id===id);mapaAberto=null;tela("");iniciarJogo();abrirManual()},
  erro:m=>{msgErro=m;if(S){S.news="⚠️ "+m;draw()}else if(mapaAberto)abrirMapa(mapaAberto==="e");else telaConectando()},
  atq:(de,i)=>{if(!S||S.fim)return;const a=ATQ[i];ap(a[1]);msg(`💣 ${de} atacou você: ${a[0]}`);S.news=`${de} atacou você!`;save();draw()},
  mundo:i=>{if(!S||S.fim)return;const e=MUNDOEV[i];ap(e.fx);msg("🌍 "+e.t);S.news=e.t;save();draw()},
  snap:()=>S&&EU.pais?{leg:legado(),aprov:Math.round(S.aprov),mes:S.mes,fim:S.fim?1:0,imp:+S.imp.toFixed(1),divida:Math.round(S.divida),g:+S.g.toFixed(1),mil:Math.round(S.ind.mil)}:null
});
telaEntrada();

</script>
<script>
"use strict";
// ===== MAPA 3D + AÇÕES ENTRE JOGADORES (bloco separado do resto do jogo) =====
const XY={CA:[56,-106],RU:[61,100],US:[39,-98],GB:[54,-2],DE:[51,10],TR:[39,35],CN:[35,103],JP:[36,138],MX:[23,-102],FR:[46,2],EG:[26,30],IN:[21,78],BR:[-10,-52],NG:[9,8],AU:[-25,134],AR:[-38,-64],ZA:[-29,24]};
const IMG="https://unpkg.com/three-globe/example/img/";
const TROCAS=[["🤝 Comércio justo (os dois crescem)",{g:.3,aprov:2},{g:.3,aprov:2}],["💸 Empréstimo (você me empresta, eu pago em popularidade)",{divida:-6},{aprov:4,g:.2}],["🔬 Troca de tecnologia (infra por educação)",{"ind.infra":6},{"ind.educ":6}],["🛡️ Aliança militar (defesa pros dois)",{"ind.mil":8},{"ind.mil":8}]];
let G=null,Gel=null,alvoG=null,fxA=[],fxR=[];const cdG={seq:0,nuke:0};
const arsenal=()=>S?1+Math.floor(S.mes/12)-(S.usadas||0):0,ativo=()=>S&&!S.fim, pw=n=>Math.ceil((cdG[n]-Date.now())/1000), coord=id=>{const j=Rede.lista()[id];return j&&XY[j.pais]};
let torres=[],fxP=[];
const upG=()=>{try{G&&Gel&&Gel.isConnected&&(G.arcsData(fxA),G.ringsData(fxR),G.pointsData(torres.concat(fxP)))}catch(e){}};
const popup=h=>{let p=$("#pop");if(!p){p=document.createElement("div");p.id="pop";p.style.cssText="position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:40";document.body.appendChild(p)}p.innerHTML=`<div class="box">${h}<button data-w="x">Fechar</button></div>`};
const fechaPop=()=>{const p=$("#pop");if(p)p.remove()};

function explode(B){
  [[0,14],[350,9],[700,6]].forEach(([t,mx])=>setTimeout(()=>{const r={lat:B[0],lng:B[1],mx,t:Date.now()};fxR.push(r);upG();setTimeout(()=>{fxR=fxR.filter(x=>x!==r);upG()},4500)},t));
  const pil={lat:B[0],lng:B[1],alt:.02,r:1.6,c:"#ff6a00",lb:"",t:Date.now()};fxP.push(pil);let k=0;
  const iv=setInterval(()=>{k++;pil.alt=k<8?.02+k*.07:Math.max(.02,.58-(k-8)*.06);pil.c=k<10?"#ff6a00":"#555";if(k>18){clearInterval(iv);fxP=fxP.filter(x=>x!==pil)}upG()},120);
  const f=$("#flash");f.classList.remove("on");void f.offsetWidth;f.classList.add("on");document.body.classList.add("treme");setTimeout(()=>document.body.classList.remove("treme"),900)}
function lanca(de,para,boom){const A=coord(de),B=coord(para);if(!A||!B)return;
  const arc={startLat:A[0],startLng:A[1],endLat:B[0],endLng:B[1],nuke:!!boom,t:Date.now()};fxA.push(arc);
  if(boom){try{G&&(G.pointOfView({lat:B[0],lng:B[1],altitude:1.6},1100),G.controls().autoRotate=false)}catch(e){}setTimeout(()=>explode(B),1300)}
  upG();setTimeout(()=>{fxA=fxA.filter(x=>x!==arc);upG()},3000)}

const col3=(n,t,px,c)=>`<div class="c3"><b>${t}</b><div class="col" style="height:${px}px;--c:${c}"><i class="f"></i><i class="s"></i><i class="t"></i></div><span>${n}</span></div>`;
function graf3d(){const it=[["Receita",S.imp,3.2,"#2ecc71"],...Object.keys(base).map(k=>[nomes[k].split(" ")[0],S.gasto[k],14,"#3498db"]),["Juros",S.divida*S.selic/100,10,"#e74c3c"]];
  return `<h2>📊 Orçamento em 3D (% do PIB)</h2><div class="g3d">`+it.map(([n,v,f,c])=>col3(n,v.toFixed(1),Math.max(4,v*f),c)).join("")+`</div>`}
setInterval(()=>{const n=fxA.length+fxR.length+fxP.length,a=Date.now();fxA=fxA.filter(x=>a-x.t<5000);fxR=fxR.filter(x=>a-x.t<7000);fxP=fxP.filter(x=>a-x.t<4000);if(n!==fxA.length+fxR.length+fxP.length)upG()},2000);
const idF=f=>{const p=f.properties;return p.ADMIN==="France"?"FR":(p.ISO_A2_EH&&p.ISO_A2_EH!=="-99"?p.ISO_A2_EH:p.ISO_A2)};
const dono=id=>Object.entries(Rede.lista()).find(([k,j])=>j.pais===id);
function foco(id){try{G.pointOfView({lat:XY[id][0],lng:XY[id][1],altitude:1.7},900);G.controls().autoRotate=false}catch(e){}}
function clique(id){const o=dono(id);
  if(!EU.pais&&!o){escolhido=id;abrirMapa(true)}
  else if(!EU.pais&&o){msgErro="Esse país já tem dono. Escolha outro!";painel()}
  else if(EU.pais&&o&&o[0]!==Rede.eu()){alvoG=o[0];foco(id);painel();G._sig=""}}
function marc(c,o){
  const meu=o&&o[0]===Rede.eu(),el=document.createElement("div");
  el.style.cssText="font-size:20px;text-align:center;cursor:pointer;transform:translate(-50%,-50%);text-shadow:0 0 4px #000;pointer-events:auto;padding:6px";
  el.innerHTML=`${c.f}<div style="font-size:10px;white-space:nowrap;color:${meu?"#2ecc71":o?"#f1c40f":"#bbb"}">${o?esc(o[1].nome):c.n}</div>`;el.onclick=()=>clique(c.id);return el}

function painel(){
  const p=$("#gpan");if(!p)return;const L=Rede.lista(),a=alvoG&&L[alvoG];let h;
  if(!EU.pais){const c=escolhido&&PAISES.find(x=>x.id===escolhido);
    h=`<h2>🌍 Escolha seu país</h2>`+(c?`<p><b>${c.f} ${c.n}:</b> ${c.tag}</p><button class="primary" data-t="ok" style="width:100%">Assumir o poder</button>`:`<p class="mut">${G?"Toque num país livre (azul) no globo. Quem chegar primeiro leva.":semGlobo?"Escolha um país livre:":"Carregando o globo 3D..."}</p>`)+`<div class="chips">${semGlobo?PAISES.map(c=>`<button data-t="sel" data-id="${c.id}" ${dono(c.id)?"disabled":""}>${c.f} ${c.n}</button>`).join(""):""}</div><p class="err">${esc(msgErro)}</p>`}
  else{const o=Object.entries(L).filter(([k,j])=>k!==Rede.eu()&&j.pais),fl=j=>(PAISES.find(x=>x.id===j.pais)||{}).f||"",s=n=>pw(n)>0?`<br>${pw(n)}s`:"",d=n=>pw(n)>0?"disabled":"";
    const bud=a&&a.imp!=null?`<div class="g3d s">${col3("Imposto",a.imp+"%",a.imp*2.2,"#2ecc71")+col3("Dívida",a.divida+"%",Math.min(110,a.divida*.8),"#e74c3c")+col3("PIB",a.g+"%",Math.max(4,a.g*14+12),"#f1c40f")+col3("Defesa",a.mil,a.mil*.9,"#3498db")}</div>`:"";
    h=(a?`<div class="alvo"><b>🎯 ${fl(a)} ${esc(a.nome)} · ${a.leg} pts</b><button data-w="x0">✕</button></div>${bud}<div class="acs"><button data-w="troca">🤝<br>Negociar</button><button data-w="seq" ${d("seq")}>🕵️<br>Sequestro${s("seq")}</button><button data-w="nuke" ${pw("nuke")>0||arsenal()<1||a.fim?"disabled":""}>☢️ ${arsenal()}<br>Bomba${s("nuke")}</button></div>`
      :`<p class="mut">${o.length?"Toque no país de um amigo no globo, ou escolha aqui:":"Nenhum amigo online ainda. Mande o link do site!"}</p>`)
      +`<div class="chips">`+o.map(([k,j])=>`<button data-w="alvo:${k}" class="${k===alvoG?"on":""}">${fl(j)} ${esc(j.nome)}</button>`).join("")+`</div>`}
  if(p._h!==h){p.innerHTML=h;p._h=h}}

let semGlobo=false,gt=0;const T0=Date.now();
function criaGlobo(){Gel=$("#globo");
  G=Globe()(Gel).globeImageUrl(IMG+"earth-blue-marble.jpg").bumpImageUrl(IMG+"earth-topology.png").backgroundImageUrl(IMG+"night-sky.png")
    .htmlElement(d=>d.el).arcColor(d=>d.nuke?["#ffb300","#ff1a1a"]:["#f1c40f","#e74c3c"]).arcDashLength(.5).arcDashGap(.2).arcDashAnimateTime(1200).arcStroke(d=>d.nuke?1.4:.6).arcAltitudeAutoScale(.6).pointAltitude(d=>d.alt).pointRadius(d=>d.r).pointColor(d=>d.c).pointResolution(12).pointsMerge(false).pointLabel(d=>d.lb||"")
    .ringColor(()=>t=>`rgba(255,${Math.round(180*(1-t))},0,${1-t})`).ringMaxRadius(d=>d.mx||9).ringPropagationSpeed(4).ringRepeatPeriod(700)
    .polygonAltitude(f=>{const o=dono(idF(f));return o&&o[0]===alvoG?.05:.015}).polygonSideColor(()=>"rgba(255,255,255,.12)").polygonStrokeColor(()=>"#9fe8b8")
    .polygonCapColor(f=>{const id=idF(f),o=dono(id);
      if(o)return o[0]===Rede.eu()?"rgba(46,204,113,.6)":o[0]===alvoG?"rgba(231,76,60,.75)":"rgba(241,196,15,.5)";
      return id===escolhido?"rgba(46,204,113,.5)":!EU.pais?"rgba(52,152,219,.4)":"rgba(255,255,255,.07)"})
    .polygonLabel(f=>{const id=idF(f),c=PAISES.find(x=>x.id===id),o=dono(id);return`<b>${c.f} ${c.n}</b>${o?"<br>👤 "+esc(o[1].nome)+" · "+o[1].leg+" pts":"<br>livre"}`})
    .onPolygonClick(f=>clique(idF(f)));
  G.controls().autoRotate=true;G.controls().autoRotateSpeed=.5;
  (function cg(i){const U=["https://cdn.jsdelivr.net/gh/vasturiano/globe.gl@master/example/datasets/ne_110m_admin_0_countries.geojson","https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson",IMG.replace("img/","datasets/")+"ne_110m_admin_0_countries.geojson"];
    if(i>=U.length)return;fetch(U[i]).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{G._geo=d.features.filter(f=>XY[idF(f)]);G._sig=""}).catch(()=>cg(i+1))})(0)}
function atualiza(){
  if(G._w!==innerWidth||G._h!==innerHeight){G._w=innerWidth;G._h=innerHeight;G.width(G._w).height(G._h)}
  const L=Rede.lista(),sig=JSON.stringify([Object.values(L).map(j=>j.nome+j.pais+j.leg+j.aprov),alvoG,escolhido,!!EU.pais,!!G._geo]);
  if(sig!==G._sig){G._sig=sig;
    G.htmlElementsData(PAISES.map(c=>({lat:XY[c.id][0],lng:XY[c.id][1],el:marc(c,dono(c.id))})));
    G.polygonsData(G._geo||[]);
    torres=[];for(const k in L){const j=L[k],xy=XY[j.pais];if(!xy)continue;const meu=k===Rede.eu();
      torres.push({lat:xy[0]+1.3,lng:xy[1],alt:.03+Math.max(0,j.leg||0)/500,r:.9,c:meu?"#2ecc71":"#f1c40f",lb:`🏙️ ${esc(j.nome)}: ${j.leg} pts`});
      torres.push({lat:xy[0]+1.3,lng:xy[1]+2.2,alt:.03+Math.max(0,j.aprov||0)/450,r:.6,c:"#4fc3f7",lb:`👍 ${esc(j.nome)}: ${j.aprov}% de aprovação`})}}
  upG()}
abrirMapa=function(escolher){
  document.body.classList.toggle("pre",!EU.pais);
  if(!EU.pais&&mapaAberto==="e"&&$("#tela").innerHTML)tela("");
  if(typeof Globe==="undefined"&&Date.now()-T0>8000)semGlobo=true;
  if(!G&&typeof Globe!=="undefined"&&gt++<3){try{criaGlobo();semGlobo=false}catch(e){semGlobo=true;G=null}}
  if(G){try{atualiza()}catch(e){}}
  painel()};
const bo=setInterval(()=>{if(G||gt>2)return clearInterval(bo);abrirMapa(false)},400);
setInterval(()=>{if(document.body.dataset.aba==="mundo"||(!EU.pais&&mapaAberto==="e"))abrirMapa(mapaAberto==="e")},1000);

const ABAS=[["mundo","🌍","Mundo"],["orc","💰","Orçamento"],["nacao","📊","Nação"],["acao","🏛️","Ações"],["rank","🏆","Ranking"]];
function aba(n){document.body.dataset.aba=n;document.querySelectorAll("#abas button").forEach(b=>b.classList.toggle("on",b.dataset.ab===n));if(n==="mundo"&&EU.pais)abrirMapa(false);window.scrollTo(0,0)}
(function(){const cs=document.querySelectorAll("main .card");["rank","orc","nacao","acao"].forEach((k,i)=>cs[i].id="c-"+k);
  const m=document.createElement("div");m.id="c-mundo";m.className="card";m.innerHTML='<div id="gpan"></div>';$("main").prepend(m);const fl=document.createElement("div");fl.id="flash";document.body.appendChild(fl);const gl=document.createElement("div");gl.id="globo";document.body.prepend(gl);
  const nav=document.createElement("nav");nav.id="abas";nav.innerHTML=ABAS.map(a=>`<button data-ab="${a[0]}"><span>${a[1]}</span>${a[2]}</button>`).join("");document.body.appendChild(nav);
  nav.onclick=e=>{const b=e.target.closest("button");if(b)aba(b.dataset.ab)};
  $("#mapa").onclick=()=>aba("mundo");document.body.dataset.aba="mundo";nav.firstChild.classList.add("on")})();


document.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("[data-w]");if(!b)return;const w=b.dataset.w,eu=Rede.eu(),L=Rede.lista();
  if(w==="x")return fechaPop();
  if(w.startsWith("aceita:")){const[,id,o]=w.split(":");ap(TROCAS[o][2]);msg("🤝 Você aceitou a troca.");Rede.enviar(id,{k:"troca_ok",o:+o,de:eu,deNome:EU.nome});fechaPop();save();draw();return}
  if(w.startsWith("recusa:")){Rede.enviar(w.split(":")[1],{k:"troca_no",de:eu,deNome:EU.nome});return fechaPop()}
  if(w.startsWith("alvo:")){alvoG=w.slice(5);const j=L[alvoG];if(j)foco(j.pais);painel();if(G)G._sig="";return}
  if(w==="x0"){alvoG=null;if(G){G.controls().autoRotate=true;G._sig=""}painel();return}
  const a=L[alvoG];if(!ativo()||!a)return;
  if(w==="troca")popup(`<h3>🤝 Propor troca a ${esc(a.nome)}</h3>`+TROCAS.map((t,i)=>`<button data-w="tr:${i}">${t[0]}</button>`).join(""));
  else if(w.startsWith("tr:")){const o=+w.slice(3);Rede.enviar(alvoG,{k:"troca",de:eu,deNome:EU.nome,o});msg(`🤝 Proposta enviada a ${a.nome}.`);fechaPop();draw()}
  else if(w==="seq"&&pw("seq")<=0){cdG.seq=Date.now()+60000;
    if(Math.random()<.55){Rede.enviar(alvoG,{k:"seq",de:eu,deNome:EU.nome});lanca(eu,alvoG);ap({aprov:6,cong:3});msg(`🕵️ Você sequestrou ${a.nome} com sucesso!`)}
    else{ap({aprov:-8,"rel.EUA":-10});msg(`🕵️ O sequestro de ${a.nome} deu errado e virou meme.`)}
    save();draw();painel()}
  else if(w==="nuke"&&pw("nuke")<=0&&arsenal()>0&&!a.fim){cdG.nuke=Date.now()+90000;S.usadas=(S.usadas||0)+1;
    ap({aprov:-8,divida:8,"rel.EUA":-20,"rel.China":-20,"rel.UE":-20,"rel.Argentina":-20});msg(`☢️ Você bombardeou ${a.nome}! O mundo te odeia.`);S.news="☢️ Você jogou uma bomba atômica em "+a.nome+".";save();draw();
    Rede.difundir({k:"nuke",de:eu,deNome:EU.nome,alvo:alvoG,alvoNome:a.nome});painel()}
});

Rede.on({acao:m=>{const eu=Rede.eu();
  if(m.k==="nuke"){lanca(m.de,m.alvo,true);if(!ativo())return;
    if(m.alvo===eu){
      if(Math.random()<Math.max(0,Math.min(.6,(S.ind.mil-40)/100))){ap({aprov:3});msg(`🛡️ Seu escudo antimíssil derrubou a bomba de ${m.deNome}!`);S.news="🛡️ Bomba interceptada!";Rede.difundir({k:"inter",de:eu,deNome:EU.nome,para:m.de})}
      else{ap({aprov:-25,g:-2,desemp:4,"ind.saude":-15,"ind.seg":-10,"ind.infra":-10});msg(`☢️ ${m.deNome} jogou uma bomba atômica em você!`);S.news=`☢️ ${m.deNome} bombardeou seu país!`}
      save();draw()}
    else if(m.de!==eu){msg(`☢️ ${m.deNome} bombardeou ${m.alvoNome}.`);draw()}}
  else if(m.k==="inter"){if(m.para===eu&&ativo()){msg(`🛡️ ${m.deNome} interceptou sua bomba!`);draw()}}
  else if(m.k==="seq"){lanca(m.de,eu);if(!ativo())return;ap({aprov:-12,cong:-10,divida:4});msg(`🕵️ ${m.deNome} te sequestrou! Resgate pago com dinheiro público.`);S.news=`🕵️ Você foi sequestrado por ${m.deNome}!`;save();draw()}
  else if(m.k==="troca"){if(!ativo())return Rede.enviar(m.de,{k:"troca_no",de:eu,deNome:EU.nome});
    popup(`<h3>🤝 ${esc(m.deNome)} propõe uma troca</h3><p>${TROCAS[m.o][0]}</p><button data-w="aceita:${m.de}:${m.o}">Aceitar</button><button data-w="recusa:${m.de}">Recusar</button>`)}
  else if(m.k==="troca_ok"&&ativo()){ap(TROCAS[m.o][1]);msg(`🤝 ${m.deNome} aceitou a troca.`);save();draw()}
  else if(m.k==="troca_no"&&ativo()){msg(`🤝 ${m.deNome} recusou sua troca.`);draw()}
}});

</script>
