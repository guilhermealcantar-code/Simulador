<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>República — Simulador de Governo Online</title>
<style>
/* ══════════════════════════════════════════════════════════
   REPÚBLICA · DESIGN SYSTEM 3D PREMIUM & TABLET OPTIMIZED
   ══════════════════════════════════════════════════════════ */
:root {
  --bg: #04060a;
  --panel: #0a0f18;
  --card: #0d1420;
  --card-border: rgba(255, 255, 255, 0.09);
  --tx: #f0f4f8;
  --mut: #68788d;
  --g: #3ec87e;
  --g2: #27a05f;
  --gd: #165233;
  --y: #d4a347;
  --yd: #8a6222;
  --r: #e0524a;
  --b: #4a90e2;
  --d: 800px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;user-select:none;touch-action:manipulation}
html,body{width:100%;height:100%;overflow-x:hidden}

body {
  font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--tx);
  overscroll-behavior: none;
  min-height: 100vh;
  padding-bottom: 85px;
  letter-spacing: .01em;
}

/* ── TIPOGRAFIA ── */
h1, h2, h3 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; color: #fff; }
h1 { font-size: 1.4rem; letter-spacing: -0.01em; }
h2 {
  font-size: 0.75rem; font-weight: 700; font-family: "Inter Tight", sans-serif;
  margin: 12px 0 8px; color: var(--y); letter-spacing: 0.12em; text-transform: uppercase;
}
#data { color: var(--mut); font-size: 0.72rem; font-weight: 500; }
h1 small { display: none; }

/* ── HEADER NEUMÓRFICO ── */
header {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  justify-content: space-between; padding: 10px 16px;
  background: rgba(10, 15, 24, 0.85);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--card-border);
  position: relative; z-index: 10;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
header::after {
  content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(62,200,126,0.4) 50%, transparent 100%);
}

/* ── BOTÕES 3D INTERATIVOS ── */
button {
  background: linear-gradient(180deg, #182232 0%, #101724 100%);
  color: var(--tx);
  border: 1px solid rgba(255,255,255,0.12);
  border-top-color: rgba(255,255,255,0.22);
  border-radius: 11px; padding: 8px 13px; cursor: pointer;
  font-size: 0.8rem; font-family: inherit; font-weight: 600;
  box-shadow: 0 4px 0 #04070c, 0 6px 14px rgba(0,0,0,0.5);
  transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
  position: relative; will-change: transform;
}
button:hover:not(:disabled) {
  background: linear-gradient(180deg, #202d42 0%, #141e2e 100%);
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #04070c, 0 10px 22px rgba(0,0,0,0.6);
}
button:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #04070c, 0 2px 5px rgba(0,0,0,0.4);
}
button:disabled { opacity: 0.3; cursor: not-allowed; }

button.primary {
  background: linear-gradient(180deg, #42db8e 0%, #22a35b 100%);
  color: #011408; font-weight: 700; border: 0;
  box-shadow: 0 4px 0 var(--gd), 0 6px 20px rgba(62,200,126,0.3);
}
button.primary:hover:not(:disabled) {
  background: linear-gradient(180deg, #53e89e 0%, #2bb868 100%);
  transform: translateY(-2px);
  box-shadow: 0 6px 0 var(--gd), 0 10px 28px rgba(62,200,126,0.4);
}
button.primary:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--gd); }

/* ── KPIS CÚBICOS HOLOGRÁFICOS ── */
#kpis {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px 14px;
  position: relative; z-index: 2;
}
.kpi {
  position: relative; text-align: center; padding: 10px 6px;
  background: linear-gradient(160deg, #101724 0%, #090e17 100%);
  border: 1px solid var(--card-border);
  border-top-color: rgba(255,255,255,0.18);
  border-radius: 14px; cursor: default; overflow: hidden;
  box-shadow: 0 5px 0 #020407, 0 8px 20px rgba(0,0,0,0.6);
  transition: transform 0.2s cubic-bezier(.2,.8,.2,1), box-shadow 0.2s;
}
.kpi::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%);
  pointer-events: none; border-radius: 14px;
}
.kpi b { display: block; font-size: 1.15rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 0.6rem; color: var(--mut); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; display: block; font-weight: 600; }

/* ── NOTÍCIAS ── */
#news {
  margin: 4px 14px 10px; padding: 10px 14px;
  background: rgba(16, 15, 10, 0.9);
  border: 1px solid rgba(212,163,71,0.25); border-left: 4px solid var(--y);
  border-radius: 11px; font-size: 0.8rem; font-style: italic; color: var(--tx);
  box-shadow: 0 4px 14px rgba(0,0,0,0.5); position: relative; z-index: 2;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* ── CARDS DE PAINEL ── */
main { display: block; max-width: 800px; margin: 0 auto; padding: 0 14px 20px; position: relative; z-index: 2; }
main > .card { display: none; margin-bottom: 12px; }
.card {
  background: rgba(13, 20, 32, 0.92);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--card-border);
  border-top-color: rgba(255,255,255,0.15);
  border-radius: 18px; padding: 10px 16px 18px;
  box-shadow: 0 6px 0 #020407, 0 12px 36px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
  animation: entra3d 0.4s cubic-bezier(.2,.8,.2,1) backwards;
}
@keyframes entra3d { from { opacity: 0; transform: translateY(16px) scale(0.98); } }

body[data-aba=mundo] #c-mundo, body[data-aba=orc] #c-orc,
body[data-aba=nacao] #c-nacao, body[data-aba=acao] #c-acao,
body[data-aba=rank] #c-rank, body[data-aba=pais] #c-pais { display: block; }

/* ── CONTROLES & BARRAS ── */
.row { margin: 10px 0; font-size: 0.82rem; }
.row label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
input[type=range] { width: 100%; accent-color: var(--g); height: 4px; margin-top: 4px; cursor: pointer; }
.bar { height: 5px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; }
.acao { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 0; font-size: 0.79rem; }

/* ── LOGS ── */
#log { max-height: 220px; overflow-y: auto; font-size: 0.78rem; color: var(--mut); }
#log p { margin: 6px 0; border-left: 2px solid rgba(62,200,126,0.3); padding-left: 10px; line-height: 1.45; }

/* ── MODAIS & OVERLAYS ── */
#modal {
  position: fixed; inset: 0; background: rgba(2,4,8,0.85);
  display: flex; align-items: center; justify-content: center;
  padding: 16px; z-index: 100; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
#modal[hidden] { display: none; }
.box {
  background: linear-gradient(165deg, #131c2a 0%, #090e17 100%);
  border: 1px solid rgba(212,163,71,0.3); border-top-color: rgba(212,163,71,0.5);
  border-radius: 20px; padding: 22px; max-width: 520px; width: 100%;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 30px 70px rgba(0,0,0,0.9);
}
.box h3 { margin-top: 0; color: var(--y); font-size: 1.15rem; font-weight: 600; margin-bottom: 10px; }
.box button { display: block; width: 100%; margin: 6px 0; text-align: left; padding: 11px 14px; }
#md { max-height: 52vh; overflow-y: auto; font-size: 0.85rem; line-height: 1.6; color: #d0d7de; }

#tela {
  position: fixed; inset: 0; background: rgba(2, 4, 8, 0.82);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  padding: 16px; z-index: 90; overflow-y: auto;
}
#tela[hidden] { display: none; }
#tela .box { max-width: 480px; width: 100%; }
#tela .box.wide { max-width: 820px; }

/* ── MAPA DE SELEÇÃO 2D ── */
.mapa { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(5, 54px); gap: 5px; margin: 12px 0; }
.pais {
  padding: 3px; font-size: 1.1rem; text-align: center; line-height: 1.1;
  border-radius: 11px; border: 1px solid rgba(255,255,255,0.08); background: #0e1624;
  box-shadow: 0 3px 0 #020408; transition: all 0.15s ease;
}
.pais small { display: block; font-size: 0.48rem; color: var(--mut); }
.pais em { display: block; font-size: 0.48rem; color: var(--y); font-style: normal; }
.pais.oc { background: #16120b; border-color: rgba(212,163,71,0.3); }
.pais.sel { border-color: var(--g) !important; background: #0b2116 !important; }

/* ── RANKING ── */
.rk { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.81rem; }
.rk button { padding: 3px 8px; }
.morto { opacity: 0.28; }
.mut { color: var(--mut); font-size: 0.81rem; }
.err { color: var(--r); font-size: 0.81rem; margin-top: 8px; display: block; }

/* ── INPUT TEXT ── */
input[type=text] {
  width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);
  background: #0a0f17; color: var(--tx); margin: 7px 0; font-size: 0.92rem; font-family: inherit;
  outline: none; transition: border-color .18s, box-shadow .18s; box-shadow: inset 0 2px 0 #020408;
}
input[type=text]:focus { border-color: rgba(62,200,126,0.4); box-shadow: inset 0 2px 0 #020408, 0 0 0 3px rgba(62,200,126,0.08); }

/* ── BARRA DE ABAS FLUTUANTE ── */
#abas {
  position: fixed; left: 50%; bottom: 14px;
  width: min(520px, calc(100% - 24px)); transform: translateX(-50%);
  display: flex; gap: 4px; padding: 6px; z-index: 50;
  background: rgba(14, 21, 33, 0.92);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.12); border-top-color: rgba(255,255,255,0.2);
  border-radius: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.8);
}
#abas button {
  flex: 1; border-radius: 18px; background: none; border: 1px solid transparent;
  box-shadow: none; font-size: 0.6rem; letter-spacing: 0.04em; padding: 8px 2px;
  text-transform: uppercase; color: var(--mut); transition: all 0.15s ease; transform: none;
}
#abas button.on {
  background: rgba(62,200,126,0.15); color: var(--g);
  border-color: rgba(62,200,126,0.3); box-shadow: inset 0 1px 0 rgba(62,200,126,0.2);
}
#abas svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; margin: 0 auto 3px; }

/* ── GLOBO 3D CANVAS OTIMIZADO ── */
#globo {
  position: fixed; inset: 0; z-index: 0; width: 100vw; height: 100vh;
  background: radial-gradient(circle at center, #070d18 0%, #020306 100%);
  touch-action: none;
}
main, #kpis, #news { pointer-events: none; position: relative; z-index: 2; }
main > .card, .kpi, #news { pointer-events: auto; }

body[data-aba=mundo] #c-mundo, body.pre #c-mundo {
  display: block; position: fixed; left: 14px; right: 14px; bottom: 82px;
  z-index: 10; max-height: 48vh; overflow-y: auto; margin: 0;
}
body.pre #c-mundo { bottom: 14px; }
body:not([data-aba=mundo]):not(.pre) #globo { display: none; }
body.pre #globo { display: block; }
body.pre header, body.pre #news, body.pre #kpis, body.pre #abas { display: none; }
#c-mundo { background: #07090e !important; border-color: rgba(255,255,255,0.07) !important; }

/* ── CONTROLES E PAINÉIS ── */
.acs { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; }
.acs button { padding: 9px 4px; text-align: center; font-size: 0.75rem; }
.alvo { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.chips button.on { border-color: rgba(62,200,126,0.4); background: rgba(62,200,126,0.1); }

/* ── ISOMETRIA 3D GRÁFICOS ── */
#inds, #rels { display: flex; gap: 6px; align-items: flex-end; height: 200px; perspective: 800px; padding: 8px 4px 0; }
#rels { height: 170px; }
.c3 { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; font-size: 0.6rem; color: var(--mut); }
.c3 b { color: var(--tx); font-size: 0.8rem; margin-bottom: 6px; font-weight: 600; }
.c3 span { margin-top: 6px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col {
  position: relative; width: 22px; transform-style: preserve-3d;
  transform: rotateX(-24deg) rotateY(-34deg);
  filter: drop-shadow(0 10px 8px rgba(0,0,0,0.7));
}
.col i { position: absolute; display: block; background: var(--c); }
.col .f { left: 0; top: 0; width: 22px; height: 100%; }
.col .s { left: 22px; top: 0; width: 14px; height: 100%; transform-origin: left; transform: rotateY(90deg); filter: brightness(0.5); }
.col .t { left: 0; top: 0; width: 22px; height: 14px; transform-origin: top; transform: rotateX(90deg); filter: brightness(1.5); }

.g3d { display: flex; gap: 5px; align-items: flex-end; height: 185px; perspective: 800px; margin: 8px 0; padding-top: 4px; }
.g3d.s { height: 125px; }
.g3d .col { width: 20px; }
.g3d .col .f, .g3d .col .t { width: 20px; }
.g3d .col .s { left: 20px; }

/* ── CARTAS DE AÇÃO 3D ── */
#acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 6px 0; }
#acoes .acao {
  display: flex; flex-direction: column; justify-content: space-between; align-items: center;
  background: linear-gradient(180deg, #131c2a 0%, #0a111a 100%);
  border: 1px solid var(--card-border); border-top-color: rgba(255,255,255,0.15);
  border-radius: 14px; padding: 12px; text-align: center; font-size: 0.8rem;
  box-shadow: 0 6px 0 #030509, 0 12px 24px rgba(0,0,0,0.5);
}
#acoes .acao button { width: 100%; margin-top: 8px; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 7px; }
.tiles button { text-align: left; padding: 10px; line-height: 1.3; font-size: .77rem; }
.tiles small { display: block; color: var(--mut); margin-top: 3px; }

/* ── FLASH + TREMOR ── */
#flash { position: fixed; inset: 0; background: radial-gradient(circle, #fff, #ffb74d 40%, transparent 75%); pointer-events: none; opacity: 0; z-index: 30; }
#flash.on { animation: fl 1.4s ease-out; }
@keyframes fl { 0% { opacity: .9; } 100% { opacity: 0; } }
.treme #globo, .treme header { animation: tr .12s 7; }
@keyframes tr { 0%,100% { transform: translate(0); } 25% { transform: translate(-7px,3px); } 50% { transform: translate(6px,-4px); } 75% { transform: translate(-3px,-4px); } }

/* ── CENA DO PAÍS ── */
.cena { perspective: 1100px; height: 350px; display: flex; align-items: center; justify-content: center; }
.plate {
  position: relative; width: 318px; height: 318px; transform-style: preserve-3d;
  transition: transform .65s cubic-bezier(.3,.8,.3,1);
  background: linear-gradient(135deg,#111a28,#070d14); border: 1px solid rgba(255,255,255,.1);
  border-top-color: rgba(255,255,255,.18); border-radius: 14px;
  box-shadow: 0 50px 80px rgba(0,0,0,.85), 0 8px 0 #020408, inset 0 1px 0 rgba(255,255,255,.06);
}
.cb { position: absolute; width: 76px; height: 76px; transform-style: preserve-3d; cursor: pointer; }
.cb i { position: absolute; display: block; background: var(--c); }
.cb .tp { left: 0; top: 0; width: 76px; height: 76px; transform: translateZ(var(--h)); filter: brightness(1.1); }
.cb .fr { left: 0; top: 76px; width: 76px; height: var(--h); transform-origin: top; transform: rotateX(90deg); filter: brightness(.65); }
.cb .sd { left: 76px; top: 0; width: var(--h); height: 76px; transform-origin: left; transform: rotateY(-90deg); filter: brightness(.42); }
.cb .lb {
  position: absolute; left: -10px; top: 26px; white-space: nowrap; font: 600 10px "Inter Tight",sans-serif;
  color: #ece8dd; background: rgba(6,8,13,.9); border: 1px solid rgba(255,255,255,.14);
  border-radius: 999px; padding: 2px 7px;
  transform: translateZ(calc(var(--h) + 18px)) rotateZ(calc(var(--rz)*-1)) rotateX(-56deg);
}

#cena3d { width: 100%; height: 50vh; border-radius: 16px; overflow: hidden; background: #030509; touch-action: none; margin: 8px 0; }
.pops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 6px 0; }
.pops div { font-size: .59rem; color: var(--mut); text-align: center; background: #0d1420; border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 6px 2px; }
.pops b { display: block; font: 700 .98rem "Inter Tight",sans-serif; color: var(--tx); }

/* RESPONSIVO */
@media (max-width: 768px) {
  #kpis { gap: 4px; padding: 8px 10px; }
  .kpi b { font-size: 1rem; }
  .mapa { grid-template-rows: repeat(5, 48px); gap: 4px; }
  #acoes { grid-template-columns: 1fr; }
}
</style>

 {t:"Ministro e o iate",d:"Seu ministro desviou verba para reformar o próprio iate.",o:[["Demitir e investigar",{aprov:2,cong:-5}],["Abafar e rezar pro caso sumir",{aprov:-8,cong:4}]]}

 ["Acordo com a China",{"rel.China":8,"rel.EUA":-3,g:.1}],
 ["Jantar com EUA e UE",{"rel.EUA":6,"rel.UE":6}],
 ["Comprar o Congresso",{cong:10,divida:.4}],
 ["Propaganda enganosa",{aprov:5,divida:.2}],
 ["Vender estatal",{divida:-2,aprov:-3,cong:2}],
 ["Postar meme no X",{aprov:3,cong:-2}]
];

const novo=()=>({mes:0,divida:75,g:2,infl:4.5,desemp:7.5,aprov:55,cong:50,selic:10.5,imp:32,
  gasto:{...base},ind:{saude:55,educ:50,seg:45,mil:40,infra:45,amb:50},
  rel:{EUA:60,China:60,Argentina:50,UE:55},cd:{},log:["Você tomou posse. O povo confia em você, o que já foi o primeiro erro."],ev:null,fim:null});

let S=novo();
let semGlobo=false;

const save=()=>{try{localStorage.setItem("rb_save",JSON.stringify(S))}catch(e){}};
function msg(t){S.log.unshift(`${dataStr()}: ${t}`);S.log=S.log.slice(0,40)}
const dataStr=()=>`${MESES[S.mes%12]}/${2027+Math.floor(S.mes/12)}`;

function tick(){
  if(!S||S.fim||S.ev!==null)return;
  const gs=Object.values(S.gasto).reduce((a,b)=>a+b,0);
  const juros=S.divida*S.selic/100, def=10+gs+juros-S.imp;
  S.divida+=def/12-S.divida*S.g/1200;
  for(const k in S.ind)S.ind[k]=cl(S.ind[k]+(S.gasto[k]-base[k])/base[k]*1.5-.25);
  S.g+=(2-(S.imp-32)*.15-(S.selic-10.5)*.18-S.g)*.25;
  S.infl=Math.max(0,S.infl+def*.02-(S.selic-10.5)*.03);
  S.aprov=cl(S.aprov+(S.g-2)*1.2-(S.infl-4.5)*1.2);
  S.mes++;
  if(S.aprov<12)S.fim="💥 Impeachment! O Congresso te derrubou.";
  else if(S.divida>120)S.fim="💥 Calote! A dívida explodiu.";
  else if(S.mes===48)msg("Fim do 1º mandato. Reeleito!");
  save();draw();
}

const kpi=(n,v,ruim)=>`<div class="kpi"><b style="color:${ruim?"var(--r)":"var(--tx)"}">${v}</b><span>${n}</span></div>`;
const cor=v=>v>=60?"var(--g)":v>=35?"var(--y)":"var(--r)";
const bar=(n,v)=>`<div class="c3"><b>${v.toFixed(0)}</b><div class="col" style="height:${Math.max(4,v*1.3)}px;--c:${cor(v)}"><i class="f"></i><i class="s"></i><i class="t"></i></div><span>${n.split(" ")[0]}</span></div>`;

function aba(n){
  document.body.dataset.aba=n;
  document.querySelectorAll("#abas button").forEach(b=>b.classList.toggle("on",b.dataset.ab===n));
  window.scrollTo(0,0);
}

function draw(){
  $("#data").textContent=`${dataStr()} · mês ${S.mes}/96`;
  $("#news").textContent="📰 "+(S.news||"Governo trabalhando normalmente.");
  $("#kpis").innerHTML=kpi("Aprovação",S.aprov.toFixed(0)+"%",S.aprov<30)+kpi("Congresso",S.cong.toFixed(0)+"%",S.cong<30)
    +kpi("PIB",S.g.toFixed(1)+"%",S.g<0)+kpi("Inflação",S.infl.toFixed(1)+"%",S.infl>8)
    +kpi("Desemprego",S.desemp.toFixed(1)+"%",S.desemp>10)+kpi("Dívida/PIB",S.divida.toFixed(0)+"%",S.divida>95);
  
  let c=`<div class="row"><label><span>Impostos</span><b>${S.imp.toFixed(1)}%</b></label><input type="range" min="20" max="45" step=".5" value="${S.imp}" data-k="imp"></div>
  <div class="row"><label><span>Taxa Selic</span><b>${S.selic.toFixed(2)}%</b></label><input type="range" min="2" max="20" step=".25" value="${S.selic}" data-k="selic"></div>`;
  $("#ctrl").innerHTML=c;
  $("#inds").innerHTML=Object.keys(S.ind).map(k=>bar(nomes[k],S.ind[k])).join("");
  $("#rels").innerHTML=Object.keys(S.rel).map(k=>bar(k,S.rel[k])).join("");
  $("#acoes").innerHTML=ACOES.map((a,i)=>`<div class="acao"><span>${a[0]}</span><button data-a="${i}">${S.cd[i]?S.cd[i]+"m":"Executar"}</button></div>`).join("");
  $("#log").innerHTML=S.log.map(l=>`<p>${l}</p>`).join("");
}

document.addEventListener("input",e=>{
  if(e.target.dataset.k) S[e.target.dataset.k]=+e.target.value;
  save(); draw();
});

$("#prox").onclick=()=>tick();
$("#ano").onclick=()=>{for(let i=0;i<3;i++)tick()};

// PROTEÇÃO ANTI-TELA PRETA NO TABLET
window._globoReady = function() {
  console.log("Globo pronto.");
};

setTimeout(function() {
  if (typeof Globe === "undefined" || !window.Globe) {
    console.warn("Navegador travou ao carregar WebGL 3D. Ativando modo seguro.");
    semGlobo = true;
    if (document.body.classList.contains("pre")) {
      document.body.classList.remove("pre");
    }
    aba("orc");
  }
}, 3000);

try {
  const pS = localStorage.getItem("rb_save");
  if (pS) S = JSON.parse(pS);
} catch(e) {
  localStorage.clear();
}

// CARREGADOR DE DEPENDÊNCIAS ROBUTO
function carregarScript(urls, cb) {
  let idx = 0;
  function prox() {
    if (idx >= urls.length) return;
    const s = document.createElement("script");
    s.src = urls[idx++]; s.onload = cb; s.onerror = prox;
    document.head.appendChild(s);
  }
  prox();
}

carregarScript([
  "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/three.js/r147/three.min.js"
], function() {
  carregarScript(["https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"], function(){});
});

carregarScript([
  "https://cdn.jsdelivr.net/npm/globe.gl@2.31.1/dist/globe.gl.min.js",
  "https://unpkg.com/globe.gl@2.31.1/dist/globe.gl.min.js"
], function() {
  iniciarGlobo();
});

function iniciarGlobo() {
  const el = document.getElementById("globo");
  if (!el || typeof Globe === "undefined") return;
  try {
    const renderizador = Globe()(el)
      .globeImageUrl("https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg")
      .bumpImageUrl("https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-topology.png")
      .backgroundImageUrl("https://cdn.jsdelivr.net/npm/three-globe/example/img/night-sky.png");
      
    renderizador.controls().autoRotate = true;
    renderizador.controls().autoRotateSpeed = 0.6;
  } catch(e) {
    console.error("Erro na GPU WebGL:", e);
    semGlobo = true;
    aba("orc");
  }
}

draw();
</script>
