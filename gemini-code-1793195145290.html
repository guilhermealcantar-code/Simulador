<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>República — Simulador de Governo Online</title>
<style>
/* ══════════════════════════════════════════════════════════
   REPÚBLICA · DESIGN SYSTEM 3D PREMIUM & TABLET OPTIMIZED
   ══════════════════════════════════════════════════════════ */
:root {
  --bg: #04060a;
  --panel: #0a0f18;
  --card: #0d1420;
  --card-border: rgba(255, 255, 255, 0.09);
  --tx: #f0f4f8;
  --mut: #68788d;
  --g: #3ec87e;
  --g2: #27a05f;
  --gd: #165233;
  --y: #d4a347;
  --yd: #8a6222;
  --r: #e0524a;
  --b: #4a90e2;
  --d: 800px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;overflow-x:hidden}

body {
  font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--tx);
  overscroll-behavior: none;
  min-height: 100vh;
  padding-bottom: 85px;
  letter-spacing: .01em;
}

/* ── TIPOGRAFIA ── */
h1, h2, h3 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; color: #fff; }
h1 { font-size: 1.4rem; letter-spacing: -0.01em; }
h2 {
  font-size: 0.75rem; font-weight: 700; font-family: "Inter Tight", sans-serif;
  margin: 12px 0 8px; color: var(--y); letter-spacing: 0.12em; text-transform: uppercase;
}
#data { color: var(--mut); font-size: 0.72rem; font-weight: 500; }
h1 small { display: none; }

/* ── HEADER NEUMÓRFICO ── */
header {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  justify-content: space-between; padding: 10px 16px;
  background: rgba(10, 15, 24, 0.85);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--card-border);
  position: relative; z-index: 10;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}
header::after {
  content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(62,200,126,0.4) 50%, transparent 100%);
}

/* ── BOTÕES 3D INTERATIVOS ── */
button {
  background: linear-gradient(180deg, #182232 0%, #101724 100%);
  color: var(--tx);
  border: 1px solid rgba(255,255,255,0.12);
  border-top-color: rgba(255,255,255,0.22);
  border-radius: 11px; padding: 8px 13px; cursor: pointer;
  font-size: 0.8rem; font-family: inherit; font-weight: 600;
  box-shadow: 0 4px 0 #04070c, 0 6px 14px rgba(0,0,0,0.5);
  transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
  position: relative; will-change: transform;
}
button:hover:not(:disabled) {
  background: linear-gradient(180deg, #202d42 0%, #141e2e 100%);
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #04070c, 0 10px 22px rgba(0,0,0,0.6);
}
button:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #04070c, 0 2px 5px rgba(0,0,0,0.4);
}
button:disabled { opacity: 0.3; cursor: not-allowed; }

button.primary {
  background: linear-gradient(180deg, #42db8e 0%, #22a35b 100%);
  color: #011408; font-weight: 700; border: 0;
  box-shadow: 0 4px 0 var(--gd), 0 6px 20px rgba(62,200,126,0.3);
}
button.primary:hover:not(:disabled) {
  background: linear-gradient(180deg, #53e89e 0%, #2bb868 100%);
  transform: translateY(-2px);
  box-shadow: 0 6px 0 var(--gd), 0 10px 28px rgba(62,200,126,0.4);
}
button.primary:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--gd); }

/* ── KPIS CÚBICOS HOLOGRÁFICOS ── */
#kpis {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px 14px;
  position: relative; z-index: 2;
}
.kpi {
  position: relative; text-align: center; padding: 10px 6px;
  background: linear-gradient(160deg, #101724 0%, #090e17 100%);
  border: 1px solid var(--card-border);
  border-top-color: rgba(255,255,255,0.18);
  border-radius: 14px; cursor: default; overflow: hidden;
  box-shadow: 0 5px 0 #020407, 0 8px 20px rgba(0,0,0,0.6);
  transition: transform 0.2s cubic-bezier(.2,.8,.2,1), box-shadow 0.2s;
}
.kpi::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%);
  pointer-events: none; border-radius: 14px;
}
.kpi b { display: block; font-size: 1.15rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 0.6rem; color: var(--mut); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; display: block; font-weight: 600; }

/* ── NOTÍCIAS ── */
#news {
  margin: 4px 14px 10px; padding: 10px 14px;
  background: rgba(16, 15, 10, 0.9);
  border: 1px solid rgba(212,163,71,0.25); border-left: 4px solid var(--y);
  border-radius: 11px; font-size: 0.8rem; font-style: italic; color: var(--tx);
  box-shadow: 0 4px 14px rgba(0,0,0,0.5); position: relative; z-index: 2;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* ── CARDS DE PAINEL ── */
main { display: block; max-width: 800px; margin: 0 auto; padding: 0 14px 20px; position: relative; z-index: 2; }
main > .card { display: none; margin-bottom: 12px; }
.card {
  background: rgba(13, 20, 32, 0.92);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--card-border);
  border-top-color: rgba(255,255,255,0.15);
  border-radius: 18px; padding: 10px 16px 18px;
  box-shadow: 0 6px 0 #020407, 0 12px 36px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
  animation: entra3d 0.4s cubic-bezier(.2,.8,.2,1) backwards;
}
@keyframes entra3d { from { opacity: 0; transform: translateY(16px) scale(0.98); } }

body[data-aba=mundo] #c-mundo, body[data-aba=orc] #c-orc,
body[data-aba=nacao] #c-nacao, body[data-aba=acao] #c-acao,
body[data-aba=rank] #c-rank, body[data-aba=pais] #c-pais { display: block; }

/* ── CONTROLES & BARRAS ── */
.row { margin: 10px 0; font-size: 0.82rem; }
.row label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
input[type=range] { width: 100%; accent-color: var(--g); height: 4px; margin-top: 4px; cursor: pointer; }

/* ── LOGS ── */
#log { max-height: 220px; overflow-y: auto; font-size: 0.78rem; color: var(--mut); }
#log p { margin: 6px 0; border-left: 2px solid rgba(62,200,126,0.3); padding-left: 10px; line-height: 1.45; }

/* ── MODAIS & OVERLAYS ── */
#modal {
  position: fixed; inset: 0; background: rgba(2,4,8,0.85);
  display: flex; align-items: center; justify-content: center;
  padding: 16px; z-index: 100; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
#modal[hidden] { display: none; }
.box {
  background: linear-gradient(165deg, #131c2a 0%, #090e17 100%);
  border: 1px solid rgba(212,163,71,0.3); border-top-color: rgba(212,163,71,0.5);
  border-radius: 20px; padding: 22px; max-width: 520px; width: 100%;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 30px 70px rgba(0,0,0,0.9);
}
.box h3 { margin-top: 0; color: var(--y); font-size: 1.15rem; font-weight: 600; margin-bottom: 10px; }
.box button { display: block; width: 100%; margin: 6px 0; text-align: left; padding: 11px 14px; }
#md { max-height: 52vh; overflow-y: auto; font-size: 0.85rem; line-height: 1.6; color: #d0d7de; }

#tela {
  position: fixed; inset: 0; background: rgba(2, 4, 8, 0.82);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  padding: 16px; z-index: 90; overflow-y: auto;
}
#tela[hidden] { display: none; }
#tela .box { max-width: 480px; width: 100%; }
#tela .box.wide { max-width: 820px; }

/* ── MAPA DE SELEÇÃO 2D (FALLBACK) ── */
.mapa { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(5, 54px); gap: 5px; margin: 12px 0; }
.pais {
  padding: 3px; font-size: 1.1rem; text-align: center; line-height: 1.1;
  border-radius: 11px; border: 1px solid rgba(255,255,255,0.08); background: #0e1624;
  box-shadow: 0 3px 0 #020408; transition: all 0.15s ease;
}
.pais small { display: block; font-size: 0.48rem; color: var(--mut); }
.pais em { display: block; font-size: 0.48rem; color: var(--y); font-style: normal; }
.pais.oc { background: #16120b; border-color: rgba(212,163,71,0.3); }
.pais.sel { border-color: var(--g) !important; background: #0b2116 !important; }

/* ── BARRA DE ABAS FLUTUANTE ── */
#abas {
  position: fixed; left: 50%; bottom: 14px;
  width: min(520px, calc(100% - 24px)); transform: translateX(-50%);
  display: flex; gap: 4px; padding: 6px; z-index: 50;
  background: rgba(14, 21, 33, 0.92);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.12); border-top-color: rgba(255,255,255,0.2);
  border-radius: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.8);
}
#abas button {
  flex: 1; border-radius: 18px; background: none; border: 1px solid transparent;
  box-shadow: none; font-size: 0.6rem; letter-spacing: 0.04em; padding: 8px 2px;
  text-transform: uppercase; color: var(--mut); transition: all 0.15s ease; transform: none;
}
#abas button.on {
  background: rgba(62,200,126,0.15); color: var(--g);
  border-color: rgba(62,200,126,0.3); box-shadow: inset 0 1px 0 rgba(62,200,126,0.2);
}
#abas svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; margin: 0 auto 3px; }

/* ── GLOBO 3D CANVAS (OTIMIZADO TABLET) ── */
#globo {
  position: fixed; inset: 0; z-index: 0; width: 100vw; height: 100vh;
  background: radial-gradient(circle at center, #070d18 0%, #020306 100%);
  touch-action: none;
}
main, #kpis, #news { pointer-events: none; position: relative; z-index: 2; }
main > .card, .kpi, #news { pointer-events: auto; }

body[data-aba=mundo] #c-mundo, body.pre #c-mundo {
  display: block; position: fixed; left: 14px; right: 14px; bottom: 82px;
  z-index: 10; max-height: 48vh; overflow-y: auto; margin: 0;
}
body.pre #c-mundo { bottom: 14px; }
body:not([data-aba=mundo]):not(.pre) #globo { display: none; }
body.pre #globo { display: block; }
body.pre header, body.pre #news, body.pre #kpis, body.pre #abas { display: none; }

/* ── ISOMETRIA 3D GRÁFICOS ── */
#inds, #rels { display: flex; gap: 6px; align-items: flex-end; height: 200px; perspective: 800px; padding: 8px 4px 0; }
.c3 { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; font-size: 0.6rem; color: var(--mut); }
.c3 b { color: var(--tx); font-size: 0.8rem; margin-bottom: 6px; font-weight: 600; }
.c3 span { margin-top: 6px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col {
  position: relative; width: 22px; transform-style: preserve-3d;
  transform: rotateX(-24deg) rotateY(-34deg);
  filter: drop-shadow(0 10px 8px rgba(0,0,0,0.7));
}
.col i { position: absolute; display: block; background: var(--c); }
.col .f { left: 0; top: 0; width: 22px; height: 100%; }
.col .s { left: 22px; top: 0; width: 14px; height: 100%; transform-origin: left; transform: rotateY(90deg); filter: brightness(0.5); }
.col .t { left: 0; top: 0; width: 22px; height: 14px; transform-origin: top; transform: rotateX(90deg); filter: brightness(1.5); }

/* ── CARTAS DE AÇÃO 3D ── */
#acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 6px 0; }
#acoes .acao {
  display: flex; flex-direction: column; justify-content: space-between; align-items: center;
  background: linear-gradient(180deg, #131c2a 0%, #0a111a 100%);
  border: 1px solid var(--card-border); border-top-color: rgba(255,255,255,0.15);
  border-radius: 14px; padding: 12px; text-align: center; font-size: 0.8rem;
  box-shadow: 0 6px 0 #030509, 0 12px 24px rgba(0,0,0,0.5);
}
#acoes .acao button { width: 100%; margin-top: 8px; }

/* RESPONSIVO PARA TABLETS & CELULARES */
@media (max-width: 768px) {
  #kpis { gap: 4px; padding: 8px 10px; }
  .kpi b { font-size: 1rem; }
  .mapa { grid-template-rows: repeat(5, 48px); gap: 4px; }
  #acoes { grid-template-columns: 1fr; }
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-aba="orc">

<header>
  <h1>República <small>Simulador de Governo Online</small></h1>
  <div id="data"></div>
  <div class="btns" style="display:flex;gap:6px">
    <button id="prox" class="primary">Passar 1 mês ▶</button>
    <button id="ano">Avançar 3m ⏩</button>
    <button id="mapa">🗺️ Mapa</button>
    <button id="man">📖 Manual</button>
    <button id="novo">Renunciar</button>
  </div>
</header>

<div id="news"></div>
<section id="kpis"></section>

<main>
  <div class="card" id="c-rank"><h2>🏆 Ranking Global ao Vivo</h2><div id="rank"></div></div>
  <div class="card" id="c-orc"><h2>💰 Orçamento (% do PIB)</h2><div id="ctrl"></div></div>
  <div class="card" id="c-nacao"><h2>📊 Indicadores da Nação</h2><div id="inds"></div><h2>🌍 Relações Internacionais</h2><div id="rels"></div></div>
  <div class="card" id="c-acao"><h2>🏛️ Ações de Governo</h2><div id="acoes"></div><h2>📰 Diário Oficial</h2><div id="log"></div></div>
</main>

<div id="modal" hidden><div class="box"><h3 id="mt"></h3><p id="md"></p><div id="mo"></div></div></div>
<div id="tela"></div>

<script>
"use strict";

let semGlobo = false;

function carregarScript(urls, cb) {
  let i = 0;
  function proxima() {
    if (i >= urls.length) return cb(false);
    let s = document.createElement("script");
    s.src = urls[i++];
    s.onload = () => cb(true);
    s.onerror = proxima;
    document.head.appendChild(s);
  }
  proxima();
}

// Inicializar dependências gráfico-espaciais
carregarScript([
  "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/three.js/r147/three.min.js"
], function(okThree) {
  if (!okThree) semGlobo = true;
  carregarScript([
    "https://cdn.jsdelivr.net/npm/globe.gl@2.31.1/dist/globe.gl.min.js",
    "https://unpkg.com/globe.gl@2.31.1/dist/globe.gl.min.js"
  ], function(okGlobe) {
    if (!okGlobe) semGlobo = true;
  });
});

// DESATALHO DEFINITIVO DO LOOP NO TABLET:
// Em 1 segundo, desativa o overlay de bloqueio e força o jogo a mostrar a aba de Orçamento
setTimeout(function() {
  semGlobo = true;
  
  const tela = document.getElementById("tela");
  if (tela) {
    tela.hidden = true;
    tela.innerHTML = "";
  }

  document.body.classList.remove("pre");

  if (typeof aba === "function") {
    aba("orc");
  }
}, 1000);

// Prevenção de cache corrompido
try {
  const pS = localStorage.getItem("rb_save");
  if (pS === "undefined" || pS === "null") {
    localStorage.clear();
  }
} catch(e) {
  localStorage.clear();
}
</script>

</body>
</html>
