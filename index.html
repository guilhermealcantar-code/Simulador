<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>República — Simulador de Governo Online</title>
<style>
/* ══════════════════════════════════
   REPÚBLICA · CSS 3D — SEM BLUR EMPILHADO
   ══════════════════════════════════ */
:root{
  --bg:#06080d;--tx:#ece8dd;--mut:#58647a;
  --g:#3ec87e;--g2:#27a05f;--gd:#1d7044;
  --y:#c4933a;--yd:#8a6222;
  --r:#c44840;--b:#4485cc;
  --d:800px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{
  font-family:"Inter Tight",system-ui,sans-serif;
  background:var(--bg);color:var(--tx);
  overscroll-behavior:none;min-height:100vh;
  padding-bottom:80px;letter-spacing:.005em;
}

/* FUNDO: gradiente simples, sem pseudo-elemento pesado */
body{background:#06080d}

/* ── TIPOGRAFIA ── */
h1,h2,h3{font-family:"Instrument Serif",Georgia,serif;font-weight:400;color:#f0ebe0}
h1{font-size:1.35rem}
h2{font-size:.72rem;font-weight:700;font-family:"Inter Tight",sans-serif;
   margin:12px 0 8px;color:var(--y);letter-spacing:.12em;text-transform:uppercase}
#data{color:var(--mut);font-size:.7rem}
h1 small{display:none}

/* ── HEADER — sem backdrop-filter ── */
header{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  justify-content:space-between;padding:9px 13px;
  background:linear-gradient(180deg,#0e1318 0%,#090d12 100%);
  border-bottom:1px solid rgba(255,255,255,.07);
  position:relative;z-index:2;
  box-shadow:0 2px 0 rgba(0,0,0,.6),0 4px 24px rgba(0,0,0,.5);
}
header::after{
  content:"";position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 0%,rgba(62,200,126,.3) 50%,transparent 100%);
}

/* ── BOTÕES 3D — profundidade com box-shadow sólida ── */
button{
  background:#182030;color:var(--tx);
  border:1px solid rgba(255,255,255,.1);
  border-top-color:rgba(255,255,255,.15);
  border-radius:10px;padding:7px 11px;cursor:pointer;
  font-size:.79rem;font-family:inherit;font-weight:500;
  box-shadow:0 4px 0 #060a10,0 5px 12px rgba(0,0,0,.5);
  transition:transform .1s,box-shadow .1s,background .12s;
  position:relative;will-change:transform;
}
button:hover:not(:disabled){
  background:#1e2a3e;
  transform:translateY(-2px);
  box-shadow:0 6px 0 #060a10,0 8px 20px rgba(0,0,0,.5);
}
button:active:not(:disabled){
  transform:translateY(3px);
  box-shadow:0 1px 0 #060a10,0 2px 6px rgba(0,0,0,.4);
}
button:disabled{opacity:.28;cursor:not-allowed}
button.primary{
  background:linear-gradient(180deg,#45d488,#2aaa62);
  color:#02180a;font-weight:700;border:0;
  box-shadow:0 4px 0 var(--gd),0 6px 18px rgba(62,200,126,.22);
}
button.primary:hover:not(:disabled){
  background:linear-gradient(180deg,#55e898,#38bf72);
  transform:translateY(-2px);
  box-shadow:0 6px 0 var(--gd),0 10px 28px rgba(62,200,126,.28);
}
button.primary:active:not(:disabled){
  transform:translateY(3px);
  box-shadow:0 1px 0 var(--gd);
}

/* ── KPIs — cubos holográficos com CSS 3D real ── */
#kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:7px 13px;
      position:relative;z-index:1}
.kpi{
  position:relative;text-align:center;padding:10px 5px 9px;
  background:#0f1620;
  border:1px solid rgba(255,255,255,.09);
  border-top-color:rgba(255,255,255,.15);
  border-radius:13px;cursor:default;overflow:hidden;
  box-shadow:0 4px 0 #040609,0 6px 20px rgba(0,0,0,.55);
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;
  will-change:transform;
}
.kpi::before{/* reflexo diagonal */
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.07) 0%,transparent 55%);
  pointer-events:none;border-radius:13px;
}
.kpi::after{/* borda inferior brilhante */
  content:"";position:absolute;bottom:0;left:15%;width:70%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(62,200,126,.35),transparent);
}
.kpi:hover{transform:perspective(500px) rotateX(-10deg) rotateY(5deg) scale(1.05);
           box-shadow:0 8px 0 #040609,0 14px 32px rgba(0,0,0,.6)}
.kpi b{display:block;font-size:1.1rem;font-weight:700;letter-spacing:-.02em;
        font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:.58rem;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;
          margin-top:3px;display:block}

/* ── NOTÍCIA ── */
#news{
  margin:7px 13px 0;padding:8px 12px;
  background:#100f08;
  border:1px solid rgba(196,147,58,.2);border-left:3px solid var(--y);
  border-radius:10px;font-size:.77rem;font-style:italic;color:var(--tx);
  box-shadow:0 3px 0 #040609,0 4px 16px rgba(0,0,0,.4);
  position:relative;z-index:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* ── CARDS — sem backdrop-filter ── */
main{display:block;max-width:760px;margin:0 auto;padding:0 13px 20px;
     position:relative;z-index:1}
main>.card{display:none;margin-bottom:10px}
.card{
  background:#0d1219;
  border:1px solid rgba(255,255,255,.08);
  border-top-color:rgba(255,255,255,.13);
  border-bottom-color:rgba(0,0,0,.5);
  border-radius:17px;padding:6px 13px 15px;
  box-shadow:0 4px 0 #020408,0 8px 32px rgba(0,0,0,.6),
             0 1px 0 rgba(255,255,255,.06) inset;
  transform:perspective(var(--d)) rotateX(0);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;
  will-change:transform;
  animation:entra3d .55s cubic-bezier(.2,.8,.2,1) backwards;
}
.card:hover{
  transform:perspective(var(--d)) translateY(-3px) rotateX(1.5deg);
  box-shadow:0 7px 0 #020408,0 16px 40px rgba(0,0,0,.65),
             0 1px 0 rgba(255,255,255,.07) inset;
}
@keyframes entra3d{from{opacity:0;transform:perspective(var(--d)) translateY(20px) rotateX(10deg)}}

body[data-aba=mundo] #c-mundo,body[data-aba=orc] #c-orc,
body[data-aba=nacao] #c-nacao,body[data-aba=acao] #c-acao,
body[data-aba=rank] #c-rank{display:block}

/* ── CONTROLES ── */
.row{margin:9px 0;font-size:.81rem}
.row label{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--g);height:3px;margin-top:3px}
.bar{height:5px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%}
.acao{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0;font-size:.79rem}

/* ── LOG ── */
#log{max-height:220px;overflow:auto;font-size:.75rem;color:var(--mut)}
#log p{margin:5px 0;border-left:2px solid rgba(62,200,126,.2);padding-left:9px;line-height:1.5}

/* ── MODAL — overlay sólido sem blur empilhado ── */
#modal{
  position:fixed;inset:0;
  background:rgba(2,4,8,.82);
  display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:15;
}
#modal[hidden]{display:none}
.box{
  background:linear-gradient(160deg,#111820,#08101a);
  border:1px solid rgba(196,147,58,.25);
  border-top-color:rgba(196,147,58,.4);
  border-radius:18px;padding:20px;
  max-width:520px;width:100%;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,
             0 40px 80px rgba(0,0,0,.85),
             0 6px 0 #020408;
}
.box h3{margin-top:0;color:var(--y);font-size:1rem;font-weight:600;
        font-family:"Instrument Serif",serif}
.box button{display:block;width:100%;margin:5px 0;text-align:left;padding:10px 12px}
#md{max-height:50vh;overflow:auto;font-size:.83rem;line-height:1.65}

/* ── TELA OVERLAY — 1 backdrop-filter apenas aqui ── */
#tela{
  position:fixed;inset:0;
  background:rgba(2,4,8,.92);
  display:flex;align-items:center;justify-content:center;
  padding:14px;z-index:20;overflow:auto;
}
#tela[hidden]{display:none}
#tela .box{max-width:460px;width:100%}
#tela .box.wide{max-width:760px}

/* ── MAPA DE PAÍSES ── */
.mapa{display:grid;grid-template-columns:repeat(9,1fr);
      grid-template-rows:repeat(5,58px);gap:4px;margin:10px 0}
.pais{
  padding:2px;font-size:1.15rem;text-align:center;line-height:1.1;
  border-radius:10px;border:1px solid rgba(255,255,255,.06);
  background:#0e1420;
  box-shadow:0 3px 0 #020408;
  transition:all .15s cubic-bezier(.2,.8,.2,1);
  will-change:transform;
}
.pais small{display:block;font-size:.5rem;color:var(--mut)}
.pais em{display:block;font-size:.49rem;color:var(--y);font-style:normal}
.pais.oc{background:#14110a;border-color:rgba(196,147,58,.25);box-shadow:0 3px 0 #0a0804}
.pais.sel{border-color:var(--g)!important;background:#081810!important;box-shadow:0 3px 0 #112808!important}
.pais:not(:disabled):hover{
  transform:translateY(-4px) scale(1.1);
  box-shadow:0 7px 0 #020408,0 10px 22px rgba(0,0,0,.5);
  background:#1a2234;border-color:rgba(255,255,255,.18);z-index:2;
}

/* ── RANKING ── */
.rk{display:flex;justify-content:space-between;align-items:center;gap:6px;
    padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.81rem}
.rk button{padding:3px 8px}
.morto{opacity:.28}
.mut{color:var(--mut);font-size:.81rem}
.err{color:var(--r);font-size:.81rem;margin-top:8px;display:block}

/* ── INPUT TEXT ── */
input[type=text]{
  width:100%;padding:11px 13px;
  border-radius:12px;border:1px solid rgba(255,255,255,.08);
  background:#0a0f17;color:var(--tx);
  margin:7px 0;font-size:.92rem;font-family:inherit;
  outline:none;transition:border-color .18s,box-shadow .18s;
  box-shadow:0 2px 0 #020408 inset;
}
input[type=text]:focus{
  border-color:rgba(62,200,126,.4);
  box-shadow:0 2px 0 #020408 inset,0 0 0 3px rgba(62,200,126,.08);
}

/* ── BARRA DE ABAS FLUTUANTE — sem backdrop-filter ── */
#abas{
  position:fixed;left:50%;bottom:12px;
  width:min(500px,calc(100% - 18px));
  transform:translateX(-50%);
  display:flex;gap:3px;padding:5px;z-index:10;
  background:linear-gradient(180deg,#131c28,#0a1018);
  border:1px solid rgba(255,255,255,.1);
  border-top-color:rgba(255,255,255,.16);
  border-radius:22px;
  box-shadow:0 4px 0 #020408,0 20px 48px rgba(0,0,0,.7),
             0 1px 0 rgba(255,255,255,.05) inset;
}
#abas button{
  flex:1;border-radius:17px;background:none;border:1px solid transparent;
  box-shadow:none;font-size:.59rem;letter-spacing:.04em;padding:7px 3px;
  text-transform:uppercase;color:var(--mut);
  transition:all .18s;transform:none;
}
#abas button:hover:not(:disabled){transform:none;background:rgba(255,255,255,.05)}
#abas button.on{
  background:rgba(62,200,126,.13);color:var(--g);
  border-color:rgba(62,200,126,.2);
  box-shadow:0 1px 0 rgba(62,200,126,.12) inset;
}
#abas svg{width:20px;height:20px;fill:none;stroke:currentColor;
          stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
          display:block;margin:0 auto 2px}

/* ── GLOBO ── */
#globo{position:fixed;inset:0;z-index:0;width:100%;height:100%;background:#000814}
#modal{z-index:15}
main,#kpis,#news{pointer-events:none;position:relative;z-index:2}
main>.card,.kpi,#news{pointer-events:auto}
body[data-aba=mundo] #c-mundo,body.pre #c-mundo{
  display:block;position:fixed;left:10px;right:10px;bottom:76px;
  z-index:5;max-height:44vh;overflow:auto;margin:0;
}
body.pre #c-mundo{bottom:12px}
body:not([data-aba=mundo]):not(.pre) #globo{display:none}
body.pre #globo{display:block}
body.pre header,body.pre #news,body.pre #kpis,body.pre #abas{display:none}
body[data-aba=mundo] #c-mundo{max-height:46vh}
#c-mundo{background:#07090e !important;border-color:rgba(255,255,255,.07) !important}

/* ── AÇÕES RÁPIDAS ── */
.acs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.acs button{padding:9px 4px;text-align:center;font-size:.75rem}
.alvo{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chips button.on{border-color:rgba(62,200,126,.4);background:rgba(62,200,126,.1)}
.btns{display:flex;gap:5px;flex-wrap:wrap}
.btns button{padding:6px 9px;font-size:.76rem}

/* ── COLUNAS 3D ISOMÉTRICAS ── */
#inds,#rels{display:flex;gap:5px;align-items:flex-end;height:210px;
            perspective:800px;padding:6px 4px 0}
#rels{height:170px}
.c3{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-end;font-size:.59rem;color:var(--mut)}
.c3 b{color:var(--tx);font-size:.77rem;margin-bottom:5px;font-weight:600}
.c3 span{margin-top:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col{
  position:relative;width:24px;
  transform-style:preserve-3d;
  transform:rotateX(-26deg) rotateY(-36deg);
  animation:cresce3d .9s cubic-bezier(.2,.8,.2,1) backwards;
  filter:drop-shadow(0 12px 8px rgba(0,0,0,.7));
}
.col i{position:absolute;display:block;background:var(--c)}
.col .f{left:0;top:0;width:24px;height:100%}
.col .s{left:24px;top:0;width:16px;height:100%;transform-origin:left;
        transform:rotateY(90deg);filter:brightness(.45)}
.col .t{left:0;top:0;width:24px;height:16px;transform-origin:top;
        transform:rotateX(90deg);filter:brightness(1.6)}
@keyframes cresce3d{from{transform:rotateX(-26deg) rotateY(-36deg) scaleY(0)}}

.g3d{display:flex;gap:5px;align-items:flex-end;height:185px;
     perspective:800px;margin:8px 0;padding-top:4px}
.g3d.s{height:125px}
.g3d .col{width:20px}
.g3d .col .f,.g3d .col .t{width:20px}
.g3d .col .s{left:20px}
.c3 .col{filter:drop-shadow(0 10px 6px rgba(0,0,0,.65))}
.c3 b,.alvo b{font:600 .88rem "Inter Tight",sans-serif}

/* ── AÇÕES DE GOVERNO — CARTAS 3D ── */
#acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;
       perspective:900px;padding:6px 0}
#acoes .acao{
  flex-direction:column;align-items:stretch;
  background:linear-gradient(180deg,#141d2e,#0c1320);
  border:1px solid rgba(255,255,255,.09);
  border-top-color:rgba(255,255,255,.15);
  border-bottom-color:rgba(0,0,0,.5);
  border-radius:14px;padding:10px;margin:0;
  transform:perspective(700px) rotateX(12deg) rotateY(-2deg);
  transform-origin:bottom center;
  box-shadow:0 10px 0 #040810,0 18px 36px rgba(0,0,0,.7);
  transition:all .2s cubic-bezier(.2,.8,.2,1);
  text-align:center;position:relative;will-change:transform;
}
#acoes .acao::before{
  content:"";position:absolute;inset:0;border-radius:14px;
  background:linear-gradient(160deg,rgba(255,255,255,.06) 0%,transparent 55%);
  pointer-events:none;
}
#acoes .acao:hover{
  transform:perspective(700px) rotateX(0) rotateY(0) translateY(-5px);
  box-shadow:0 14px 0 #040810,0 28px 50px rgba(0,0,0,.65);
}
#acoes .acao button{box-shadow:0 3px 0 #040810;margin-top:6px;font-size:.75rem}
#acoes .acao button:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 #040810}

.acs button:active:not(:disabled),.chips button:active,.btns button:active{
  transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.5);
}

/* ── TILES ── */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.tiles button{text-align:left;padding:10px;line-height:1.3;font-size:.77rem}
.tiles small{display:block;color:var(--mut);margin-top:3px}
.h2{margin-top:6px}.h2 button{padding:8px 4px;font-size:.72rem;text-align:center}

/* ── FLASH + TREMOR ── */
#flash{position:fixed;inset:0;background:radial-gradient(circle,#fff,#ffb74d 40%,transparent 75%);
       pointer-events:none;opacity:0;z-index:30}
#flash.on{animation:fl 1.4s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
.treme #globo,.treme header{animation:tr .12s 7}
@keyframes tr{0%,100%{transform:translate(0)}25%{transform:translate(-7px,3px)}
              50%{transform:translate(6px,-4px)}75%{transform:translate(-3px,-4px)}}

/* ── VISÃO DO PAÍS (tabuleiro 3D) ── */
.cena{perspective:1100px;height:350px;display:flex;align-items:center;justify-content:center}
.plate{
  position:relative;width:318px;height:318px;
  transform-style:preserve-3d;
  transition:transform .65s cubic-bezier(.3,.8,.3,1);
  background:linear-gradient(135deg,#111a28,#070d14);
  border:1px solid rgba(255,255,255,.1);
  border-top-color:rgba(255,255,255,.18);
  border-radius:14px;
  box-shadow:0 50px 80px rgba(0,0,0,.85),0 8px 0 #020408,
             0 1px 0 rgba(255,255,255,.06) inset;
}
.cb{position:absolute;width:76px;height:76px;transform-style:preserve-3d;cursor:pointer}
.cb i{position:absolute;display:block;background:var(--c)}
.cb .tp{left:0;top:0;width:76px;height:76px;transform:translateZ(var(--h));filter:brightness(1.1)}
.cb .fr{left:0;top:76px;width:76px;height:var(--h);transform-origin:top;
        transform:rotateX(90deg);filter:brightness(.65)}
.cb .sd{left:76px;top:0;width:var(--h);height:76px;transform-origin:left;
        transform:rotateY(-90deg);filter:brightness(.42)}
.cb .lb{
  position:absolute;left:-10px;top:26px;white-space:nowrap;
  font:600 10px "Inter Tight",sans-serif;color:#ece8dd;
  background:rgba(6,8,13,.9);border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:2px 7px;
  transform:translateZ(calc(var(--h) + 18px)) rotateZ(calc(var(--rz)*-1)) rotateX(-56deg);
  box-shadow:0 2px 6px rgba(0,0,0,.6);
}
.cb.ruim .tp{animation:alerta .9s infinite alternate}
@keyframes alerta{to{background:#c44840;filter:brightness(1.9)}}
.cb.sel .tp{outline:2px solid rgba(255,255,255,.75);outline-offset:1px}
.cb:hover .tp{filter:brightness(1.5)}
.rot{display:flex;gap:7px;justify-content:center;margin:2px 0 8px}
.det{border-top:1px solid rgba(255,255,255,.07);padding-top:10px}
.ctl{display:flex;align-items:center;gap:8px;margin:8px 0}
.ctl span{flex:1;font-size:.82rem}.ctl button{width:40px}

/* Mini-pessoas */
.pp{position:absolute;width:7px;height:7px;transform-style:preserve-3d;pointer-events:none}
.pp::before{content:"";position:absolute;inset:0;background:var(--c);
            transform:translateZ(11px);filter:brightness(1.2)}
.pp::after{content:"";position:absolute;left:0;top:7px;width:7px;height:11px;
           background:var(--c);filter:brightness(.6);transform-origin:top;transform:rotateX(90deg)}
.pp.prot{animation:agita .5s infinite alternate}
@keyframes agita{to{translate:0 -4px}}

/* Efeitos de área */
.fogo{left:20px;top:20px;width:36px;height:36px;border-radius:50% 50% 40% 40%;
      background:radial-gradient(#ffe08a,#ff6a00 60%,#b01800)!important;
      filter:none!important;transform:translateZ(calc(var(--h)+4px));
      animation:chama .35s infinite alternate;pointer-events:none}
@keyframes chama{to{transform:translateZ(calc(var(--h)+16px)) scale(1.3);opacity:.75}}
.miss{position:absolute;width:18px;height:18px;transform-style:preserve-3d;
      animation:cai 1.4s cubic-bezier(.5,0,1,.6) forwards;pointer-events:none}
.miss i{display:block;width:18px;height:18px;border-radius:50%;
        background:radial-gradient(#fff,#ff8a00 60%);box-shadow:0 0 18px 8px rgba(255,138,0,.8)}
@keyframes cai{from{transform:translateZ(460px)}to{transform:translateZ(2px)}}
.crat{position:absolute;width:96px;height:96px;border-radius:50%;
      background:radial-gradient(#000,#1b0f0a 55%,transparent 72%);
      opacity:0;animation:crat 1s 1.4s forwards;pointer-events:none}
@keyframes crat{to{opacity:.95}}
.cogu{position:absolute;width:40px;height:40px;transform-style:preserve-3d;pointer-events:none}
.cogu i{position:absolute;inset:0;border-radius:50%;
        background:radial-gradient(#fff,#ff8a00 55%,#6b1a00);
        opacity:0;animation:sobe 2.6s 1.4s forwards}

function tick(){
  if(!S||S.fim||S.ev!==null)return;
  const gs=Object.values(S.gasto).reduce((a,b)=>a+b,0);
  const juros=S.divida*S.selic/100, def=10+gs+juros-S.imp;
  S.divida+=def/12-S.divida*S.g/1200;
  for(const k in S.ind)S.ind[k]=cl(S.ind[k]+(S.gasto[k]-base[k])/base[k]*1.5-.25+(Math.random()-.5)*.4);
  for(const k in S.rel)S.rel[k]=cl(S.rel[k]+(S.ind.mil-50)/500+(50-S.rel[k])*.01);
  const rg=Object.values(S.rel).reduce((a,b)=>a+b,0)/4-55;
  const gt=2+(S.ind.infra-50)/25+(S.ind.educ-50)/60+rg/30-(S.imp-32)*.15-(S.selic-10.5)*.18-(S.infl-4.5)*.12+(S.cong-50)/80;
  S.g+=(gt-S.g)*.25+(Math.random()-.5)*.2;
  S.infl=Math.max(0,S.infl+def*.02-(S.selic-10.5)*.03-(S.infl-4.5)*.04+(Math.random()-.5)*.15);
  S.desemp=Math.max(2,S.desemp-(S.g-2)*.08+(S.selic-10.5)*.02);
  const t=(S.g-2)*1.2-(S.infl-4.5)*1.2-(S.desemp-7.5)*1.2+(S.ind.saude-50)/25+(S.ind.seg-50)/30+(S.ind.educ-50)/60-(S.imp-32)*.3;
  S.aprov=cl(S.aprov+t*.4-.2);
  S.cong=cl(S.cong+(S.aprov-S.cong)*.05);
  for(const k in S.cd)if(--S.cd[k]<=0)delete S.cd[k];
  S.mes++;
  if(S.aprov<12){S.fim="💥 Impeachment! Foi o único assunto em que o Congresso inteiro concordou.";}
  else if(S.divida>100&&Math.random()<.04){S.fim="🚔 Você foi preso por não pagar as dívidas do país! O policial disse: “o senhor tem direito de ficar calado, mas o Serasa não”.";}

  else if(S.mes===48){

    else S.fim="🗳️ Você perdeu a reeleição. Ainda dá tempo de virar coach de palestra motivacional.";
  }else if(S.mes>=96)S.fim="🏁 Fim do mandato. Você sai com aposentadoria vitalícia e o país com a conta.";
  if(!S.fim&&Math.random()<.35)S.ev=Math.floor(Math.random()*EVENTOS.length);
  S.news=manchete();save();draw();
}
function manchete(){const h=["Estudo mostra que 100% dos políticos prometem e 0% lembram.","Brasileiro descobre que o Pix também funciona pra pagar dívida (sem sucesso).","Tio do zap compartilha 14 áudios dizendo que o governo é culpado por tudo."];

  if(S.ind.seg<35)h.push("Bandido começa a oferecer seguro contra assalto. O preço é justo.");
  if(S.cong<30)h.push("Congresso te ignora tanto que já te trata como parente.");
  return h[Math.floor(Math.random()*h.length)]}

const titulo=p=>p>105?"Melhor que o anterior, o que não é difícil":p>80?"Mediano, tipo todo político":p>55?"Meio ruim, mas teve churrasco":p>25?"Pior que o anterior, parabéns":"Obrigado, os memes do Brasil agradecem";
function legado(){const i=Object.values(S.ind).reduce((a,b)=>a+b,0)/6;
  return Math.round(S.aprov+i+S.g*5-S.divida/4-S.infl*2-S.desemp);}

<script>
"use strict";
// Rede: um único mundo global via MQTT sobre WebSocket (brokers públicos, sem cadastro e sem servidor próprio).
// Cada jogador publica o próprio estado numa mensagem "retida"; quem sai tem a mensagem apagada pelo broker (testamento).
// País: quem tiver o carimbo de tempo mais antigo leva. Eventos mundiais: o jogador de menor id sorteia.
const Rede=(()=>{
  const P="repbr/v2/";
  const API="/api/mundo",POLL=4000;
  const BROKERS=["wss://mqtt.eclipseprojects.io:443/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://broker.emqx.io:8084/mqtt","wss://test.mosquitto.org:8081"];
  const TOTAL=BROKERS.length+1;
  const id=(()=>{const n=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);try{let v=sessionStorage.getItem("rb_id")||localStorage.getItem("rb_id");if(!v){v=n;sessionStorage.setItem("rb_id",v);localStorage.setItem("rb_id",v)}else{sessionStorage.setItem("rb_id",v)}return v}catch(e){return n}})();
  let cl=null,modo=null,outbox=[],seqCli=-1,pollT=null,busy=false,again=false,fails=0,tent=0,esperaLib=0,querOn=false,conectado=false,off=false,lista={},cb={},meu=null,confirmado=false,tp=null,sorteioOn=false,tempo=null,pendente=null;
  const avisa=()=>cb.lista&&cb.lista(lista);
  const falha=m=>cb.erro&&cb.erro(m);
  const pub=(t,o,retain)=>{
    if(!conectado)return;
    if(modo==="api"){
      if(t==="mundo")outbox.push({to:"*",m:o});
      else if(t.indexOf("atq/")===0)outbox.push({to:t.slice(4),m:o});
      apiKick();return}
    if(!cl)return;
    try{cl.publish(P+t,o==null?"":JSON.stringify(o),{qos:0,retain:!!retain})}catch(e){}};
  const sig=o=>JSON.stringify(Object.keys(o).sort().map(k=>{const j=o[k];return[k,j.pais,j.nome,j.leg,j.aprov,j.mes,j.fim]}));
  function aplica(d){
    seqCli=typeof d.seq==="number"?d.seq:seqCli;
    const agora=Date.now(),novo={};
    for(const k in d.players){if(k===id)continue;const m=d.players[k];if(m&&typeof m==="object"){m.rt=agora;novo[k]=m}}
    if(meu){meu.rt=agora;novo[id]=meu}
    const mudou=sig(novo)!==sig(lista);
    lista=novo;
    for(const m of (d.inbox||[]))m.k?(cb.acao&&cb.acao(m)):(cb.atq&&cb.atq(m.de,m.i));
    for(const e of (d.world||[])){const m=e.m;if(m.k){cb.acao&&cb.acao(m);continue}if(!m.para||m.para===id)cb.mundo&&cb.mundo(m.i)}
    if(mudou)avisa();
  }
  async function apiPoll(n){
    const out=outbox;outbox=[];
    const ctl=typeof AbortController!=="undefined"?new AbortController():null,to=setTimeout(()=>ctl&&ctl.abort(),7000);
    try{
      const me=meu?Object.assign({},meu):null;if(me)delete me.rt;
      const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,me,send:out,since:seqCli}),signal:ctl?ctl.signal:undefined,cache:"no-store"});
      if(!r.ok)throw new Error("http "+r.status);
      const d=await r.json();
      if(!d||typeof d!=="object"||!d.players)throw new Error("resposta invalida");
      if(n===tent)aplica(d);
    }catch(e){outbox=out.concat(outbox);throw e}
    finally{clearTimeout(to)}
  }
  function agenda(n,ms){clearTimeout(pollT);pollT=setTimeout(()=>doPoll(n),ms)}
  async function doPoll(n){
    if(n!==tent||modo!=="api")return;
    if(busy){again=true;return}
    if(typeof document!=="undefined"&&document.hidden){agenda(n,15000);return}
    busy=true;
    try{await apiPoll(n);fails=0}catch(e){fails++}
    busy=false;
    if(n!==tent||modo!=="api")return;
    if(fails>=3){conectado=false;confirmado=false;lista={};avisa();falha("A conexão caiu. Reconectando ao mundo...");setTimeout(()=>tenta(0),1500);return}
    const r=again;again=false;agenda(n,r?60:POLL);
  }
  function apiKick(){if(modo!=="api"||!conectado)return;clearTimeout(pollT);pollT=setTimeout(()=>doPoll(tent),60)}
  function apiTenta(){
    const n=++tent;fecha();modo="api";fails=0;seqCli=-1;
    apiPoll(n).then(()=>{
      if(n!==tent)return;
      conectado=true;timers();
      setTimeout(()=>{if(n!==tent||!conectado)return;cb.pronto&&cb.pronto()},400);
      agenda(n,POLL);
    }).catch(()=>{if(n!==tent)return;proximo(0,n)});
  }
  const limpaMeu=()=>{meu=null;confirmado=false;pub("p/"+id,null,true);delete lista[id];avisa()};

  function dono(pais){ // vencedor do país: carimbo mais antigo, desempate por id
    let w=null;
    for(const k in lista){const j=lista[k];if(j.pais!==pais)continue;
      if(!w||j.t<lista[w].t||(j.t===lista[w].t&&k<w))w=k}
    return w;
  }
  function onMsg(topic,buf){
    let m=null;const s=buf?buf.toString():"";
    if(topic.indexOf(P+"p/")===0){
      const k=topic.slice((P+"p/").length);
      if(!s){delete lista[k];if(k===id&&meu&&confirmado)pub("p/"+id,meu,true)}
      else{try{m=JSON.parse(s)}catch(e){return}
        if(k===id&&!meu)return; // eco de algo que já descartei
        m.rt=Date.now();lista[k]=m}
      avisa();
    }else if(topic===P+"atq/"+id){try{m=JSON.parse(s)}catch(e){return}m.k?(cb.acao&&cb.acao(m)):(cb.atq&&cb.atq(m.de,m.i))}
    else if(topic===P+"mundo"){try{m=JSON.parse(s)}catch(e){return}
      if(m.k){cb.acao&&cb.acao(m);return}
      if(!m.para||m.para===id)cb.mundo&&cb.mundo(m.i)}
  }
  function sorteio(){
    if(!conectado&&!off)return;
    const ids=Object.keys(lista).filter(k=>lista[k].pais).sort();
    if(!ids.length||ids[0]!==id)return;
    const i=Math.floor(Math.random()*MUNDOEV.length);
    const para=MUNDOEV[i].solo?ids[Math.floor(Math.random()*ids.length)]:null;
    if(off)(!para||para===id)&&cb.mundo&&cb.mundo(i);else pub("mundo",{i,para},false);
  }
  function envioEstado(){if(meu&&confirmado)pub("p/"+id,meu,true)}
  function timers(){
    if(sorteioOn)return;sorteioOn=true;
    setInterval(sorteio,40000);
    setInterval(envioEstado,20000);
    setInterval(()=>{const a=Date.now();let mudou=false;for(const k in lista)if(k!==id&&a-lista[k].rt>75000){delete lista[k];mudou=true}if(mudou)avisa()},10000);
    if(typeof window!=="undefined"&&window.addEventListener)window.addEventListener("pagehide",()=>{try{if(modo==="api"){navigator.sendBeacon&&navigator.sendBeacon(API,JSON.stringify({id,me:null}))}else pub("p/"+id,null,true)}catch(e){}});
  }

  function fecha(){clearTimeout(pollT);modo=null;busy=false;again=false;try{cl&&(cl.removeAllListeners&&cl.removeAllListeners(),cl.on&&cl.on("error",()=>{}),cl.end(true))}catch(e){}cl=null;conectado=false}
  function tenta(i){
    if(off||!querOn)return;
    if(i===0)return apiTenta();
    if(typeof mqtt==="undefined"){if(++esperaLib>8){esperaLib=0;return proximo(i,tent)}setTimeout(()=>tenta(i),1000);return}
    const n=++tent;fecha();
    let c;
    try{c=mqtt.connect(BROKERS[i-1],{clientId:"rb"+id,clean:true,connectTimeout:9000,reconnectPeriod:0,keepalive:30,
      will:{topic:P+"p/"+id,payload:"",qos:0,retain:true}})}
    catch(e){return proximo(i,n)}
    cl=c;
    let ok=false;
    const limite=setTimeout(()=>{if(n===tent&&!ok){proximo(i,n)}},11000);
    c.on("connect",()=>{
      if(n!==tent)return;
      c.subscribe([P+"p/+",P+"atq/"+id,P+"mundo"],{qos:0},err=>{
        if(n!==tent)return;
        if(err){clearTimeout(limite);return proximo(i,n)}
        ok=true;clearTimeout(limite);conectado=true;timers();
        // espera as mensagens retidas (jogadores já no mundo) chegarem antes de mostrar o mapa
        setTimeout(()=>{if(n!==tent||!conectado)return;cb.pronto&&cb.pronto()},1500);
      });
    });
    c.on("message",(t,b)=>{if(n===tent)onMsg(t,b)});
    c.on("error",()=>{if(n!==tent)return;if(!ok){clearTimeout(limite);proximo(i,n)}});
    c.on("close",()=>{
      if(n!==tent)return;
      if(!ok){clearTimeout(limite);return proximo(i,n)}
      conectado=false;confirmado=false;lista={};avisa();
      falha("A conexão caiu. Reconectando ao mundo...");
      setTimeout(()=>tenta(0),1500+Math.random()*1500);
    });
  }
  function proximo(i,n){
    if(n!==tent||off||!querOn)return;
    tent++;fecha();
    if(i+1<TOTAL){falha("Conectando ao mundo... (servidor "+(i+2)+" de "+TOTAL+")");setTimeout(()=>tenta(i+1),300)}
    else{falha("Sem resposta dos servidores. Tentando de novo...");setTimeout(()=>tenta(0),3000)}
  }

  return{
    on:o=>{Object.assign(cb,o)},lista:()=>lista,eu:()=>id,
    conectar(){off=false;querOn=true;if(cl||conectado)return;tenta(0)},
    parar(){querOn=false;tent++;fecha();lista={}},
    reviver(){if(!querOn||off)return;if(modo==="api"&&conectado){apiKick();return}if(!conectado||(cl&&cl.connected===false)){tent++;fecha();conectado=false;tenta(0)}},
    offline(){off=true;querOn=false;tent++;fecha();lista={};timers();cb.pronto&&cb.pronto()},
    escolherPais(pais,nome){
      for(const k in lista)if(k!==id&&lista[k].pais===pais)return falha("Esse país já tem dono. Escolha outro!");
      if(!off&&!conectado)return falha("Sem conexão com o mundo ainda. Aguarde um instante.");
      const antigo=meu&&meu.pais===pais?meu:null;
      meu=antigo||{nome:String(nome||"Presidente").slice(0,16),pais,leg:0,aprov:0,mes:0,fim:0,t:Date.now()};
      meu.rt=Date.now();lista[id]=meu;confirmado=false;
      if(off){confirmado=true;avisa();return cb.ok&&cb.ok(pais)}
      pub("p/"+id,meu,true);avisa();
      clearTimeout(pendente);
      if(modo==="api")setTimeout(apiKick,650);
      pendente=setTimeout(()=>{ // janela de 1s para ver se alguém mais antigo pediu o mesmo país
        if(!meu||meu.pais!==pais)return;
        if(dono(pais)===id){confirmado=true;cb.ok&&cb.ok(pais)}
        else{limpaMeu();falha("Esse país já tem dono. Escolha outro!")}
      },1000);
    },
    publicar(){
      clearTimeout(tp);
      tp=setTimeout(()=>{
        const d=cb.snap&&cb.snap();if(!d||!meu||!confirmado)return;
        Object.assign(meu,d);
        if(off){avisa();return}
        pub("p/"+id,meu,true);
      },300);
    },
    enviar(para,m){if(!off)pub("atq/"+para,m,false)},
    difundir(m){if(off)cb.acao&&cb.acao(m);else pub("mundo",m,false)},
    atacar(para,i){
      const j=lista[para];if(!j)return;
      if(off)return;
      pub("atq/"+para,{de:(meu&&meu.nome)||"Alguém",i},false);
    }
  };
})();

<script>
"use strict";
// Interface do jogador: painéis, botões e manual
const cor=v=>v>=60?"var(--g)":v>=35?"var(--y)":"var(--r)";
const bar=(n,v)=>`<div class="c3"><b>${v.toFixed(0)}</b><div class="col" style="height:${Math.max(4,v*1.3)}px;--c:${cor(v)}"><i class="f"></i><i class="s"></i><i class="t"></i></div><span>${n.split(" ")[0]}</span></div>`;
const kpi=(n,v,ruim)=>`<div class="kpi"><b style="color:${ruim?"var(--r)":"var(--tx)"}">${v}</b><span>${n}</span></div>`;

function draw(){
  $("#data").textContent=`${quem()} · ${dataStr()} · Mandato ${S.mes<48?1:2} · mês ${S.mes}/96`;
  $("#news").textContent="📰 "+(S.news||"Extra: você ainda não estragou nada. Dá tempo.");
  $("#kpis").innerHTML=kpi("Aprovação",S.aprov.toFixed(0)+"%",S.aprov<30)+kpi("Congresso",S.cong.toFixed(0)+"%",S.cong<30)
    +kpi("Crescimento",S.g.toFixed(1)+"%",S.g<0)+kpi("Inflação",S.infl.toFixed(1)+"%",S.infl>8)
    +kpi("Desemprego",S.desemp.toFixed(1)+"%",S.desemp>10)+kpi("Dívida/PIB",S.divida.toFixed(0)+"%",S.divida>95);
  const gs=Object.values(S.gasto).reduce((a,b)=>a+b,0), def=10+gs+S.divida*S.selic/100-S.imp;
  let c=`<div class="row"><label><span>Carga tributária</span><b>${S.imp.toFixed(1)}%</b></label><input type="range" min="20" max="45" step=".5" value="${S.imp}" data-k="imp"></div>
  <div class="row"><label><span>Selic (Banco Central)</span><b>${S.selic.toFixed(2)}%</b></label><input type="range" min="2" max="20" step=".25" value="${S.selic}" data-k="selic"></div>`;
  for(const k in base)c+=`<div class="row"><label><span>${nomes[k]}</span><b>${S.gasto[k].toFixed(1)}%</b></label><input type="range" min="0" max="${base[k]*2.5}" step=".1" value="${S.gasto[k]}" data-g="${k}"></div>`;
  c+=`<p style="font-size:.8rem;color:${def>0?"var(--r)":"var(--g)"}">Resultado anual: ${def>0?"déficit (a conta fica pros seus netos)":"superávit (alguém roubou menos que o normal)"}: ${Math.abs(def).toFixed(1)}% do PIB</p>`;
  $("#ctrl").innerHTML=graf3d()+c;
  $("#inds").innerHTML=Object.keys(S.ind).map(k=>bar(nomes[k],S.ind[k])).join("");
  $("#rels").innerHTML=Object.keys(S.rel).map(k=>bar(k,S.rel[k])).join("");
  $("#acoes").innerHTML=ACOES.map((a,i)=>`<div class="acao"><span>${a[0]}</span><button data-a="${i}" ${S.cd[i]||S.fim?"disabled":""}>${S.cd[i]?S.cd[i]+"m":"Aprontar"}</button></div>`).join("");
  $("#log").innerHTML=S.log.map(l=>`<p>${l}</p>`).join("");
  $("#prox").disabled=$("#ano").disabled=!!S.fim;
  const m=$("#modal");
  if(S.fim){$("#mt").textContent=S.fim;$("#md").textContent=`Legado: ${legado()} pontos (${titulo(legado())}). Aprovação ${S.aprov.toFixed(0)}%, dívida ${S.divida.toFixed(0)}% do PIB.`;
    $("#mo").innerHTML=`<button onclick="reset()">Fazer tudo errado de novo</button>`;m.hidden=false;}
  else if(S.ev!==null){const e=EVENTOS[S.ev];$("#mt").textContent=e.t;$("#md").textContent=e.d;
    $("#mo").innerHTML=e.o.map((o,i)=>`<button data-e="${i}">${o[0]}</button>`).join("")+`<button data-e="coin">🎲 Cara ou coroa (deixa o azar decidir)</button>`;m.hidden=false;}
  else m.hidden=true;
}
function reset(){iniciarJogo()}

document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.g)S.gasto[t.dataset.g]=+t.value;else if(t.dataset.k)S[t.dataset.k]=+t.value;else return;
  save();const p=t.previousElementSibling;if(p)p.querySelector("b").textContent=(+t.value).toFixed(1);});
document.addEventListener("change",e=>{if(e.target.type==="range")draw()});
document.addEventListener("click",e=>{const t=e.target;
  if(t.dataset.a!==undefined){const a=ACOES[t.dataset.a];ap(a[1]);S.cd[t.dataset.a]=6;msg(a[0]+".");save();draw();}
  if(t.dataset.e!==undefined){const ix=t.dataset.e==="coin"?Math.floor(Math.random()*2):t.dataset.e;const o=EVENTOS[S.ev].o[ix];ap(o[1]);msg(`${EVENTOS[S.ev].t}: ${o[0]}.`);S.ev=null;save();draw();}
});
$("#prox").onclick=()=>tick();
$("#ano").onclick=()=>{for(let i=0;i<3&&!S.fim&&S.ev===null;i++)tick()};
const MANUAL=`<b>Objetivo:</b> sobreviver 8 anos sem ser preso, derrubado ou cancelado.<br><br>
<b>Topo da tela:</b><br>• <b>Aprovação</b>: abaixo de 12% = impeachment. No mês 48 ela decide a reeleição.<br>• <b>Congresso</b>: apoio dos deputados. Baixo = tudo piora.<br>• <b>Crescimento</b>: o PIB. Quanto mais, melhor.<br>• <b>Inflação</b>: acima de 20% o país acaba.<br>• <b>Desemprego</b>: alto derruba sua aprovação.<br>• <b>Dívida/PIB</b>: acima de 100% pode te levar pra cadeia, acima de 130% é calote.<br><br>
<b>Orçamento (barras deslizantes):</b><br>• <b>Carga tributária</b>: mais imposto = mais dinheiro, mas o povo te odeia e a economia freia.<br>• <b>Selic</b>: alta segura a inflação mas trava o crescimento. Baixa faz o contrário.<br>• <b>Gastos</b>: gastar mais melhora o setor, mas aumenta a dívida.<br>• Embaixo aparece déficit (vermelho: dívida sobe) ou superávit (verde: dívida cai).<br><br>
<b>Nação:</b> barra verde é boa, vermelha é desastre. Saúde, educação, segurança e infraestrutura mexem com crescimento e aprovação. Defesa ajuda nas relações. Meio ambiente agrada a Europa.<br><br>
<b>Relações:</b> EUA, China, UE e Argentina. Relação boa ajuda o PIB. Agradar um às vezes irrita outro.<br><br>
<b>Ações de governo:</b> cada uma só pode ser usada 1 vez a cada 6 meses. Leia o nome com atenção, a maioria tem pegadinha.<br><br>
<b>Eventos:</b> aparecem sozinhos e você escolhe. Com preguiça, use o 🎲 cara ou coroa.<br><br>
<b>Online:</b> cada jogador tem seu país. No ranking, clique no 💣 de um rival pra atacar (recarga de 20s). O host sorteia eventos mundiais que atingem todo mundo. O botão 🗺️ Mapa mostra quem é dono de quê.<br><br><b>Dica pros burros:</b> não deixe a dívida estourar, mantenha a aprovação acima de 40 e não aperte botão vermelho nenhum.`;
function abrirManual(){$("#mt").textContent="📖 Manual do Presidente (pra quem não sabe ler)";$("#md").innerHTML=MANUAL;$("#mo").innerHTML='<button id="fechar">Entendi, vamos errar</button>';$("#modal").hidden=false}
$("#man").onclick=abrirManual;
document.addEventListener("click",e=>{if(e.target.id==="fechar")draw()});
$("#novo").onclick=()=>{if(confirm("Renunciar e recomeçar do zero?"))reset()};

<script>
"use strict";
// Início do jogo: telas de entrada e mapa, ranking, ataques e ligação com a rede
const EU={nome:"",pais:null};
// Restaurar sessão salva (evita precisar reescolher tudo ao reabrir o app)
(()=>{try{const pId=_lsGet("rb_pais"),pNome=_lsGet("rb_nome"),pS=_lsGet("rb_save");if(pId&&pNome&&pS){const p=PAISES.find(x=>x.id===pId);if(p){EU.nome=pNome;EU.pais=p;S=Object.assign(novo(),pS,{gasto:Object.assign({},base,pS.gasto),ind:Object.assign(novo().ind,pS.ind),rel:Object.assign(novo().rel,pS.rel),cd:pS.cd||{}});}}}catch(e){}})();
let escolhido=null,mapaAberto=null,proxAtq=0,alvoAtq=null,msgErro="";
const quem=()=>EU.pais?`${EU.pais.f} ${EU.nome}`:"";
const tela=h=>{const t=$("#tela");t.innerHTML=h;t.hidden=!h};
const nm=()=>(($("#nome")&&$("#nome").value.trim())||"Presidente").slice(0,16);

function iniciarJogo(){
  S=novo();const m=EU.pais.mod;
  for(const k in m)S[k]+=m[k];
  S.aprov=cl(S.aprov);S.desemp=Math.max(2,S.desemp);S.infl=Math.max(0,S.infl);S.divida=Math.max(5,S.divida);
  S.log=[`${EU.nome} tomou posse em ${EU.pais.n}. ${EU.pais.tag}`];
  save();draw();
}

// ---- telas ----
function telaEntrada(){
  tela(`<div class="box entrada-box" style="padding:26px 22px">
    <div style="text-align:center;margin-bottom:22px">
      <div style="font-size:3rem;margin-bottom:8px;filter:drop-shadow(0 8px 16px rgba(78,203,141,.3))">🏛️</div>
      <div style="font-size:2.1rem;font-family:'Instrument Serif',serif;background:linear-gradient(135deg,#7edda8 0%,#4ecb8d 50%,#c9993a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.01em;line-height:1">República</div>
      <p style="color:var(--mut);font-size:.8rem;margin:8px 0 0;line-height:1.5">Simulador de governo online · mundo compartilhado<br>Quem chegar primeiro leva o país.</p>
    </div>
    <div style="position:relative;margin-bottom:4px">
      <label style="display:block;font-size:.68rem;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px">Nome do presidente</label>
      <input type="text" id="nome" maxlength="16" placeholder="Seu nome aqui" value="${esc(EU.nome)}" style="margin:0" autofocus>
    </div>
    <button class="primary" data-t="entrar" style="width:100%;margin-top:12px;padding:14px;font-size:.9rem;border-radius:13px;letter-spacing:.02em">Entrar no mundo →</button>
    <div style="display:flex;align-items:center;gap:10px;margin:14px 0 8px">
      <div style="flex:1;height:1px;background:rgba(255,255,255,.06)"></div>
      <span style="font-size:.7rem;color:var(--mut)">ou</span>
      <div style="flex:1;height:1px;background:rgba(255,255,255,.06)"></div>
    </div>
    <button data-t="offline" style="width:100%;padding:10px;color:var(--mut);font-size:.79rem;border-color:rgba(255,255,255,.05)">🕹️ Jogar offline (sem ranking)</button>
  </div>`);
}
function telaConectando(){
  const tt=$("#tela"),cm=tt&&!tt.hidden&&tt.querySelector("#conn-msg");
  if(cm){cm.textContent=msgErro||"";cm.style.display=msgErro?"":"none";return}
  tela(`<div class="box entrada-box" style="text-align:center">
    <div style="font-size:2.2rem;margin-bottom:8px;animation:spin 1.8s linear infinite;display:inline-block">🌍</div>
    <h2 style="font-size:1.3rem;font-family:'Instrument Serif',serif;margin:0 0 8px">Conectando ao mundo...</h2>
    <p class="mut" style="font-size:.83rem;margin:0 0 14px;line-height:1.5">Procurando outros presidentes.<br>Pode levar alguns segundos.</p>
    <p class="err" id="conn-msg" style="background:rgba(217,95,85,.08);border-radius:8px;padding:8px 12px;border:1px solid rgba(217,95,85,.2);${msgErro?"":"display:none"}">${esc(msgErro)}</p>
    <button data-t="offline" style="width:100%;margin:8px 0;padding:11px">🕹️ Jogar offline (sem ranking)</button>
    <button data-t="voltar" style="width:100%;padding:10px;color:var(--mut);font-size:.8rem">← Voltar</button>
  </div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>`);
}
function abrirMapa(escolher){
  const L=Rede.lista(),dono=id=>Object.values(L).find(j=>j.pais===id),p=escolhido&&PAISES.find(x=>x.id===escolhido);
  tela(`<div class="box wide"><h2>${escolher?"🗺️ Escolha seu país":"🗺️ Mapa do mundo"}</h2><div class="mapa">`+
    PAISES.map(c=>{const d=dono(c.id),meu=EU.pais&&EU.pais.id===c.id;
      return `<button class="pais ${d?"oc":""} ${meu||escolhido===c.id?"sel":""}" style="grid-column:${c.c};grid-row:${c.r}" ${escolher&&!d?`data-t="sel" data-id="${c.id}"`:"disabled"}>${c.f}<small>${c.n}</small>${d?`<em>${esc(d.nome)}</em>`:""}</button>`}).join("")+`</div>`+
    (escolher?(p?`<p><b>${p.f} ${p.n}:</b> ${p.tag}</p><button class="primary" data-t="ok" style="width:100%">Assumir o poder</button>`:`<p class="mut">${PAISES.every(c=>dono(c.id))?"Mundo lotado! Espere alguém sair.":"Clique num país livre. Quem chegar primeiro leva."}</p>`)+`<p class="err">${esc(msgErro)}</p>`
      :`<button data-t="fechar" style="width:100%">Fechar mapa</button>`)+`</div>`);
}

// ---- ranking e ataques ----
function desenhaRank(){
  const L=Rede.lista(),o=Object.entries(L).sort((a,b)=>(a[1].fim-b[1].fim)||b[1].leg-a[1].leg);
  $("#rank").innerHTML=`<p class="mut">🌍 Mundo ao vivo · ${o.length} jogando</p>`+o.map(([id,j],i)=>{
    const p=PAISES.find(x=>x.id===j.pais),meu=id===Rede.eu();
    return `<div class="rk ${j.fim?"morto":""}"><span>${["🥇","🥈","🥉"][i]||(i+1)+"º"} ${p?p.f:""} ${esc(j.nome)}${meu?" (você)":""}${j.fim?" 💀":""}</span><b>${j.leg} pts</b>${meu||j.fim?"":`<button data-t="atk" data-id="${id}">💣</button>`}</div>`}).join("");
}
function menuAtaque(id){
  const j=Rede.lista()[id];if(!j||!S||S.fim||S.ev!==null)return;
  alvoAtq=id;const w=Math.ceil((proxAtq-Date.now())/1000);
  $("#mt").textContent="💣 Atacar "+j.nome;
  $("#md").textContent=w>0?`Armas recarregando... ${w}s`:"Escolha o ataque (recarga de 20s).";
  $("#mo").innerHTML=ATQ.map((a,i)=>`<button data-t="atq" data-i="${i}" ${w>0?"disabled":""}>${a[0]}</button>`).join("")+`<button id="fechar">Cancelar</button>`;
  $("#modal").hidden=false;
}
function atacar(i){
  const a=ATQ[i],j=Rede.lista()[alvoAtq];if(!a||!j||Date.now()<proxAtq)return;
  Rede.atacar(alvoAtq,i);ap(a[2]);msg(`Você atacou ${j.nome}: ${a[0]}`);
  proxAtq=Date.now()+20000;save();draw();
}

// ---- cliques ----
document.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("[data-t]");if(!b)return;
  const t=b.dataset.t,id=b.dataset.id;
  if(t==="entrar"){EU.nome=nm();msgErro="";telaConectando();try{Rede.conectar()}catch(err){msgErro="Erro de conexão: "+err.message;telaConectando()}
    clearTimeout(window._connTimeout);
  }
  else if(t==="offline"){clearTimeout(window._connTimeout);msgErro="";Rede.offline()}
  else if(t==="voltar"){clearTimeout(window._connTimeout);Rede.parar();msgErro="";telaEntrada()}
  else if(t==="sel"){escolhido=id;msgErro="";abrirMapa(true)}
  else if(t==="ok"&&escolhido)Rede.escolherPais(escolhido,EU.nome);
  else if(t==="fechar"){mapaAberto=null;tela("")}
  else if(t==="atk")menuAtaque(id);
  else if(t==="atq")atacar(+b.dataset.i);
});
$("#mapa").onclick=()=>{mapaAberto="v";abrirMapa(false)};

// ---- ligação com a rede ----
Rede.on({
  pronto:()=>{if(EU.pais&&S)Rede.escolherPais(EU.pais.id,EU.nome);else{mapaAberto="e";abrirMapa(true)}},
  lista:()=>{desenhaRank();if(mapaAberto)abrirMapa(mapaAberto==="e")},
  ok:id=>{if(EU.pais&&S){save();return}EU.pais=PAISES.find(x=>x.id===id);mapaAberto=null;tela("");document.body.classList.remove("pre");if(typeof aba==="function")aba("orc");iniciarJogo();abrirManual()},
  erro:m=>{msgErro=m;if(S){S.news="⚠️ "+m;draw()}else if(mapaAberto)abrirMapa(mapaAberto==="e");else if($("#conn-msg"))telaConectando()},
  atq:(de,i)=>{if(!S||S.fim)return;const a=ATQ[i];ap(a[1]);msg(`💣 ${de} atacou você: ${a[0]}`);S.news=`${de} atacou você!`;save();draw()},
  mundo:i=>{if(!S||S.fim)return;const e=MUNDOEV[i];ap(e.fx);msg("🌍 "+e.t);S.news=e.t;save();draw()},
  snap:()=>S&&EU.pais?{leg:legado(),aprov:Math.round(S.aprov),mes:S.mes,fim:S.fim?1:0,imp:+S.imp.toFixed(1),divida:Math.round(S.divida),g:+S.g.toFixed(1),mil:Math.round(S.ind.mil)}:null
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)Rede.reviver()});
window.addEventListener("pageshow",e=>{if(e.persisted)Rede.reviver()});
// Se há sessão salva, tenta reconectar direto; senão mostra tela de entrada
if(EU.pais&&S){try{draw();tela("");setTimeout(()=>{if(typeof aba==="function")aba("orc")},50);try{Rede.conectar()}catch(e){}}
  catch(e){console.warn(e);try{["rb_save","rb_pais","rb_nome"].forEach(k=>localStorage.removeItem(k))}catch(_){}S=null;EU.pais=null;telaEntrada()}}else{telaEntrada()}
setTimeout(()=>{const t=$("#tela");if(t&&!t.hidden&&!t.innerHTML.trim())t.hidden=true},3000);

</script>
<script>
"use strict";
// ===== MAPA 3D + AÇÕES ENTRE JOGADORES (bloco separado do resto do jogo) =====
const XY={CA:[56,-106],RU:[61,100],US:[39,-98],GB:[54,-2],DE:[51,10],TR:[39,35],CN:[35,103],JP:[36,138],MX:[23,-102],FR:[46,2],EG:[26,30],IN:[21,78],BR:[-10,-52],NG:[9,8],AU:[-25,134],AR:[-38,-64],ZA:[-29,24]};
const IMG="https://cdn.jsdelivr.net/npm/three-globe/example/img/";
const TROCAS=[["🤝 Comércio justo (os dois crescem)",{g:.3,aprov:2},{g:.3,aprov:2}],["💸 Empréstimo (você me empresta, eu pago em popularidade)",{divida:-6},{aprov:4,g:.2}],["🔬 Troca de tecnologia (infra por educação)",{"ind.infra":6},{"ind.educ":6}],["🛡️ Aliança militar (defesa pros dois)",{"ind.mil":8},{"ind.mil":8}]];
let G=null,Gel=null,alvoG=null,fxA=[],fxR=[];const cdG={seq:0,nuke:0};
const arsenal=()=>S?1+Math.floor(S.mes/12)-(S.usadas||0):0,ativo=()=>S&&!S.fim, pw=n=>Math.ceil((cdG[n]-Date.now())/1000), coord=id=>{const j=Rede.lista()[id];return j&&XY[j.pais]};
let torres=[],fxP=[];
const upG=()=>{try{G&&Gel&&Gel.isConnected&&(G.arcsData(fxA),G.ringsData(fxR),G.pointsData(torres.concat(fxP)))}catch(e){}};
const popup=h=>{let p=$("#pop");if(!p){p=document.createElement("div");p.id="pop";p.style.cssText="position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:40";document.body.appendChild(p)}p.innerHTML=`<div class="box">${h}<button data-w="x">Fechar</button></div>`};
const fechaPop=()=>{const p=$("#pop");if(p)p.remove()};

function explode(B){som("boom");
  [[0,14],[350,9],[700,6]].forEach(([t,mx])=>setTimeout(()=>{const r={lat:B[0],lng:B[1],mx,t:Date.now()};fxR.push(r);upG();setTimeout(()=>{fxR=fxR.filter(x=>x!==r);upG()},4500)},t));
  const pil={lat:B[0],lng:B[1],alt:.02,r:1.6,c:"#ff6a00",lb:"",t:Date.now()};fxP.push(pil);let k=0;
  const iv=setInterval(()=>{k++;pil.alt=k<8?.02+k*.07:Math.max(.02,.58-(k-8)*.06);pil.c=k<10?"#ff6a00":"#555";if(k>18){clearInterval(iv);fxP=fxP.filter(x=>x!==pil)}upG()},120);
  const f=$("#flash");f.classList.remove("on");void f.offsetWidth;f.classList.add("on");document.body.classList.add("treme");setTimeout(()=>document.body.classList.remove("treme"),900)}
function lanca(de,para,boom){const A=coord(de),B=coord(para);if(!A||!B)return;
  const arc={startLat:A[0],startLng:A[1],endLat:B[0],endLng:B[1],nuke:!!boom,t:Date.now()};fxA.push(arc);
  if(boom){som("whoosh");try{G&&(G.pointOfView({lat:B[0],lng:B[1],altitude:1.6},1100),G.controls().autoRotate=false)}catch(e){}setTimeout(()=>explode(B),1300)}
  upG();setTimeout(()=>{fxA=fxA.filter(x=>x!==arc);upG()},3000)}

const col3=(n,t,px,c)=>`<div class="c3"><b>${t}</b><div class="col" style="height:${px}px;--c:${c}"><i class="f"></i><i class="s"></i><i class="t"></i></div><span>${n}</span></div>`;

// Hover 3D dinâmico com mouse — só desktop, sem toque
(function(){
  let raf=0,cur=null;
  function reset(el){
    if(!el)return;
    el.style.transform="";el.style.boxShadow="";cur=null;
  }
  document.addEventListener("pointermove",e=>{
    if(e.pointerType==="touch"||e.buttons)return;
    const el=e.target.closest&&e.target.closest(
      ".card:not(#c-mundo):not(#c-pais),.kpi"
    );
    if(!el){reset(cur);return}
    if(cur&&cur!==el)reset(cur);
    cur=el;
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{
      const r=el.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width-.5;
      const y=(e.clientY-r.top)/r.height-.5;
      const isK=el.classList.contains("kpi");
      const rx=(isK?-y*14:-y*6).toFixed(2);
      const ry=(isK?x*10:x*8).toFixed(2);
      el.style.transform=`perspective(${isK?500:800}px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(${isK?6:3}px)`;
      el.style.boxShadow=isK
        ?`0 ${8+Math.abs(+rx)}px 0 #020408,0 ${14+Math.abs(+rx)*2}px 28px rgba(0,0,0,.65)`
        :`0 7px 0 #020408,0 14px 36px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.06) inset`;
    });
  });
  document.addEventListener("pointerleave",()=>reset(cur),true);
  document.addEventListener("pointerout",e=>{
    if(!e.relatedTarget||!e.relatedTarget.closest(".card,.kpi"))reset(cur);
  });
})();
